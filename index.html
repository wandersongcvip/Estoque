  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function toDatetimeLocalValue(d) {

  }

  function todayKey() { return localDateKey(new Date()); }

  function firstDayOfMonthKey() {
    var d = new Date();

  async function refetchItem(id) {
    var res = await supabaseClient.from("items").select("*").eq("id", id).single();
    if (res.error || !res.data) return null;
    var mapped = mapItemFromDb(res.data);
    var idx = -1;
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) { idx = i; break; }
    if (idx >= 0) state.items[idx] = mapped; else state.items.push(mapped);

    state.movements = state.movements.filter(function (m) { return m.id !== id; });
    state.movements.unshift(mv);

  // Gerenciar pessoas (criar, trocar e-mail/senha, excluir) exige poder de
  // administrador no servidor, por isso passa por uma função segura do
  // Supabase (Edge Function) e não direto pelo navegador.
  async function callAdminUsers(body) {
    var res = await supabaseClient.functions.invoke("admin-usuarios", { body: body });
    if (res.error) {
      var msg = "Não foi possível concluir. Tente novamente.";
      try {
        if (res.error.context && res.error.context.json) {
          var j = await res.error.context.json();
          if (j && j.erro) msg = j.erro;
        }
      } catch (e) {}
      return { ok: false, erro: msg };
    }
    return { ok: true, data: res.data };
  }

  async function loadUsers() {
    if (!state.currentUser) { state.users = []; return; }
    if (isAdmin()) {
      var r = await callAdminUsers({ acao: "listar" });
      if (r.ok && r.data && r.data.usuarios) {
        state.users = r.data.usuarios.map(function (u) {
          return { id: u.user_id, username: u.nome, email: u.email || "", role: u.role, createdAt: u.created_at };
        });
        return;
      }
    }
    var res = await supabaseClient.from("profiles").select("user_id,display_name,role,created_at").order("created_at");
    if (res.error) { state.globalError = "Não foi possível carregar os usuários: " + res.error.message; state.users = []; return; }
    state.users = (res.data || []).map(mapProfile);

  // Lê a sessão do login seguro (Supabase Auth) e carrega quem é a pessoa
  // e a empresa dela. Retorna false se não houver sessão válida.
  async function loadProfile() {
    state.currentUser = null; state.company = null; state.platform = null;
    var s = await supabaseClient.auth.getSession();
    var session = s && s.data && s.data.session;
    if (!session) return false;
    var pRes = await supabaseClient.from("profiles").select("user_id,display_name,role,company_id").eq("user_id", session.user.id).maybeSingle();
    if (!pRes.data) {
      // sem empresa: pode ser o administrador da plataforma
      var pf = await supabaseClient.rpc("eh_plataforma");
      if (pf && pf.data === true) {
        state.platform = { id: session.user.id, email: session.user.email || "" };
        if (!state.plat) platReset();
        return true;
      }
      return false;
    }
    if (pRes.error) return false;
    state.platform = null;
    var cRes = await supabaseClient.from("companies").select("id,name,logo_url,dashboard_token").eq("id", pRes.data.company_id).maybeSingle();
    state.currentUser = { id: session.user.id, username: pRes.data.display_name, email: session.user.email || "", role: pRes.data.role, companyId: pRes.data.company_id };
    var c = cRes && cRes.data;
    state.company = c ? { id: c.id, name: c.name, logoUrl: c.logo_url, token: c.dashboard_token } : { id: pRes.data.company_id, name: "", logoUrl: null, token: null };
    return true;
  }

  async function doLogin() {
    if (state.loginBusy) return;
    var userEl = document.getElementById("login-user");
    var passEl = document.getElementById("login-pass");
    var email = userEl ? userEl.value.trim() : "";
    var pass = passEl ? passEl.value : "";
    state.loginEmail = email;
    if (!email || !pass) {
      state.loginError = "Informe e-mail e senha.";
      render();
      return;
    }
    state.loginBusy = true; state.loginError = ""; render();
    var res = await supabaseClient.auth.signInWithPassword({ email: email, password: pass });
    if (res.error) {
      state.loginBusy = false;
      state.loginError = "E-mail ou senha inválidos.";
      render();
      return;
    }
    var ok = await loadProfile();
    if (!ok) {
      try { await supabaseClient.auth.signOut(); } catch (e) {}
      state.loginBusy = false;
      state.loginError = "Esta conta não está ativa ou não está ligada a nenhuma empresa. Fale com o suporte do STOCKAR.";
      render();
      return;
    }
    if (state.platform) {
      platReset(); await loadPlatformData(); startPlatformPolling();
      state.loginBusy = false; state.loginEmail = ""; render();
      return;
    }
    state.loading = true; state.activeTab = "dashboard"; state.globalError = "";
    await refreshAllData();
    state.loading = false; state.loginBusy = false; state.loginEmail = "";
    checkChangelog();
    startRealtime();
    render();
  }

    state.brandDraft = null; state.brandMsg = null;

      if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT")) return;

  async function doChangePassword() {
    if (!state.currentUser) return;
    var cur = (document.getElementById("chpwd-current") || {}).value || "";
    var nw = (document.getElementById("chpwd-new") || {}).value || "";
    var conf = (document.getElementById("chpwd-confirm") || {}).value || "";
    state.passwordSuccess = false;
    if (!cur) {
      state.passwordError = "Informe a senha atual.";
      render();
      return;
    }
    if (!nw || nw.length < 8) {
      state.passwordError = "A nova senha deve ter ao menos 8 caracteres.";
      render();
      return;
    }
    if (nw !== conf) {
      state.passwordError = "As senhas novas não coincidem.";
      render();
      return;
    }
    state.saving = true; render();
    var chk = await supabaseClient.auth.signInWithPassword({ email: state.currentUser.email, password: cur });
    if (chk.error) {
      state.saving = false;
      state.passwordError = "Senha atual incorreta.";
      render();
      return;
    }
    var upd = await supabaseClient.auth.updateUser({ password: nw });
    state.saving = false;
    if (upd.error) {
      state.passwordError = "Não foi possível salvar a nova senha: " + upd.error.message;
      render();
      return;
    }
    state.passwordError = "";
    state.passwordSuccess = true;
    render();
  }

  // ---------- planilhas Excel ----------

  function safeSheetName(name, used) {
    var s = String(name == null ? "" : name).replace(/[\\\/\?\*\[\]:]/g, "").trim();
    if (!s) s = "Categoria";
    if (s.length > 31) s = s.slice(0, 31);
    var base = s, n = 2;
    while (used[s]) {
      var suf = "-" + n;
      s = base.slice(0, 31 - suf.length) + suf;
      n++;
    }
    return s;
  }

  function exportExcel() {
    if (typeof XLSX === "undefined") {
      state.importMsg = { type: "error", text: "Não foi possível carregar a biblioteca de Excel. Verifique sua conexão com a internet e tente novamente." };
      render();
      return;
    }
    var wb = XLSX.utils.book_new();
    var catRows = state.categories.map(function (c) { return { Categoria: c.label, Cor: c.color }; });
    var catWs = XLSX.utils.json_to_sheet(catRows.length ? catRows : [{ Categoria: "", Cor: "" }]);
    XLSX.utils.book_append_sheet(wb, catWs, "Categorias");

    var usedNames = { "Categorias": true };
    state.categories.forEach(function (c) {
      var items = state.items.filter(function (it) { return it.category === c.key; });
      var rows = items.map(function (it) {
        return {
          "Nome": it.name,
          "Unidade": it.unit,
          "Quantidade atual": Number(it.qty) || 0,
          "Nível baixo até": Number(it.min) || 0,
          "Nível OK a partir de": Number(it.ideal) || 0,
          "Valor médio (R$)": Number(it.avgCost) || 0
        };
      });
      var ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ "Nome": "", "Unidade": "", "Quantidade atual": "", "Nível baixo até": "", "Nível OK a partir de": "", "Valor médio (R$)": "" }]);
      var sheetName = safeSheetName(c.label, usedNames);
      usedNames[sheetName] = true;
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });

    try {
      XLSX.writeFile(wb, "controle-de-estoque.xlsx");
    } catch (e) {
      state.importMsg = { type: "error", text: "Não foi possível gerar o arquivo Excel." };
      render();
    }
  }

  function handleImportFile(file) {
    if (typeof XLSX === "undefined") {
      state.importMsg = { type: "error", text: "Não foi possível carregar a biblioteca de Excel. Verifique sua conexão com a internet e tente novamente." };
      render();
      return;
    }
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, { type: "array" });
        importWorkbook(wb);
      } catch (err) {
        state.importMsg = { type: "error", text: "Não foi possível ler o arquivo. Verifique se é uma planilha Excel válida." };
        render();
      }
    };
    reader.onerror = function () {
      state.importMsg = { type: "error", text: "Não foi possível ler o arquivo." };
      render();
    };
    reader.readAsArrayBuffer(file);
  }

  async function importWorkbook(wb) {
    var stats = { categoriasNovas: 0, itensNovos: 0, itensAtualizados: 0, linhasIgnoradas: 0 };
    var admin = isAdmin();
    var newItemRows = [];
    var updateOps = [];

    if (wb.SheetNames.indexOf("Categorias") !== -1) {
      var catRows = XLSX.utils.sheet_to_json(wb.Sheets["Categorias"], { defval: "" });
      for (var ci = 0; ci < catRows.length; ci++) {
        var row0 = catRows[ci];
        var label = String(row0["Categoria"] || "").trim();
        if (!label) continue;
        if (findCategoryByLabel(label)) continue;
        if (!admin) { stats.linhasIgnoradas++; continue; }
        var color = String(row0["Cor"] || "").trim();
        if (!/^#[0-9a-fA-F]{6}$/.test(color)) color = "#6B7280";
        var newCat = { key: uniqueCategoryKey(slugify(label)), label: label, color: color };
        var catRes = await insertCategory(newCat);
        if (!catRes.error) { state.categories.push(newCat); stats.categoriasNovas++; }
      }
    }

    for (var si = 0; si < wb.SheetNames.length; si++) {
      var sheetName = wb.SheetNames[si];
      if (sheetName === "Categorias") continue;
      var cat = findCategoryByLabel(sheetName);
      if (!cat) {
        if (!admin) { stats.linhasIgnoradas++; continue; }
        cat = { key: uniqueCategoryKey(slugify(sheetName)), label: sheetName, color: "#6B7280" };
        var catRes2 = await insertCategory(cat);
        if (catRes2.error) { stats.linhasIgnoradas++; continue; }
        state.categories.push(cat);
        stats.categoriasNovas++;
      }
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: "" });
      for (var ri = 0; ri < rows.length; ri++) {
        var row = rows[ri];
        var name = String(row["Nome"] || "").trim();
        if (!name) { stats.linhasIgnoradas++; continue; }
        var unit = String(row["Unidade"] || "un").trim() || "un";
        var qty = Number(row["Quantidade atual"]) || 0;
        var min = Number(row["Nível baixo até"]) || 0;
        var ideal = Number(row["Nível OK a partir de"]) || 0;
        var importedAvgCost = Number(row["Valor médio (R$)"]) || 0;
        var existingItem = null;
        for (var i = 0; i < state.items.length; i++) {
          if (state.items[i].category === cat.key && state.items[i].name.trim().toLowerCase() === name.toLowerCase()) { existingItem = state.items[i]; break; }
        }
        if (existingItem) {
          updateOps.push(supabaseClient.from("items").update({ unit: unit, qty: qty, min: min, ideal: ideal }).eq("id", existingItem.id).then(function (res) {
            if (!res.error) stats.itensAtualizados++; else stats.linhasIgnoradas++;
          }));
          existingItem.unit = unit; existingItem.qty = qty; existingItem.min = min; existingItem.ideal = ideal;
        } else {
          newItemRows.push({ jsItem: { id: uid(), category: cat.key, name: name, unit: unit, qty: qty, min: min, ideal: ideal, avgCost: importedAvgCost } });
        }
      }
    }

    if (newItemRows.length) {
      var dbRows = newItemRows.map(function (n) {
        return { id: n.jsItem.id, category: n.jsItem.category, name: n.jsItem.name, unit: n.jsItem.unit, qty: n.jsItem.qty, min: n.jsItem.min, ideal: n.jsItem.ideal, avg_cost: n.jsItem.avgCost };
      });
      var insertRes = await supabaseClient.from("items").insert(dbRows);
      if (!insertRes.error) {
        newItemRows.forEach(function (n) { state.items.push(n.jsItem); stats.itensNovos++; });
      } else {
        stats.linhasIgnoradas += newItemRows.length;
      }
    }
    await Promise.all(updateOps);

    var parts = [];
    if (stats.categoriasNovas) parts.push(stats.categoriasNovas + " categoria(s) criada(s)");
    parts.push(stats.itensNovos + " item(ns) criado(s)");
    parts.push(stats.itensAtualizados + " item(ns) atualizado(s)");
    if (stats.linhasIgnoradas) parts.push(stats.linhasIgnoradas + " linha(s) ignorada(s)");
    state.importMsg = { type: "success", text: "Importação concluída: " + parts.join(", ") + "." };
    render();
  }

  // ---------- importação de nota fiscal (XML da NF-e) ----------

  function xmlTag(parent, tag) {
    if (!parent) return "";
    var el = parent.getElementsByTagName(tag)[0];
    return el ? (el.textContent || "").trim() : "";
  }

  function parseNFeXml(text) {
    var xml = new DOMParser().parseFromString(text, "application/xml");
    if (xml.getElementsByTagName("parsererror").length) {
      throw new Error("arquivo XML inválido");
    }
    var infNFe = xml.getElementsByTagName("infNFe")[0];
    if (!infNFe) throw new Error("isso não parece ser o XML de uma NF-e");

    var emit = xml.getElementsByTagName("emit")[0];
    var ide = xml.getElementsByTagName("ide")[0];
    var total = xml.getElementsByTagName("ICMSTot")[0];
    var infProt = xml.getElementsByTagName("infProt")[0];

    var accessKey = xmlTag(infProt, "chNFe");
    if (!accessKey) {
      var idAttr = infNFe.getAttribute("Id") || "";
      accessKey = idAttr.replace(/^NFe/, "");
    }

    var dhEmi = xmlTag(ide, "dhEmi");
    var invoice = {
      supplierCnpj: xmlTag(emit, "CNPJ"),
      supplierName: xmlTag(emit, "xNome"),
      number: xmlTag(ide, "nNF"),
      series: xmlTag(ide, "serie"),
      accessKey: accessKey,
      issueDate: dhEmi ? new Date(dhEmi) : null,
      totalValue: Number(xmlTag(total, "vNF")) || 0
    };

    var dets = xml.getElementsByTagName("det");
    var items = [];
    for (var i = 0; i < dets.length; i++) {
      var prod = dets[i].getElementsByTagName("prod")[0];
      if (!prod) continue;
      var ean = xmlTag(prod, "cEAN");
      if (!ean || ean.toUpperCase() === "SEM GTIN") ean = "";
      items.push({
        ean: ean,
        supplierCode: xmlTag(prod, "cProd"),
        xmlName: xmlTag(prod, "xProd"),
        unit: xmlTag(prod, "uCom") || "un",
        qty: Number(xmlTag(prod, "qCom")) || 0,
        unitValue: Number(xmlTag(prod, "vUnCom")) || 0
      });
    }
    if (!items.length) throw new Error("nenhum item encontrado nessa nota");

    return { invoice: invoice, items: items };
  }

  async function prepareNfReview(parsed, xmlContent) {
    var invoice = parsed.invoice;
    invoice.xmlContent = xmlContent;

    var eans = [];
    parsed.items.forEach(function (it) { if (it.ean) eans.push(it.ean); });

    var linkMap = {};
    if (eans.length && invoice.supplierCnpj) {
      var linkRes = await supabaseClient.from("item_supplier_links").select("ean,item_id")
        .eq("supplier_cnpj", invoice.supplierCnpj).in("ean", eans);
      if (!linkRes.error && linkRes.data) {
        linkRes.data.forEach(function (row) { linkMap[row.ean] = row.item_id; });
      }
    }

    var reviewItems = parsed.items.map(function (it) {
      var matchedId = it.ean && linkMap[it.ean] ? linkMap[it.ean] : "";
      var autoMatched = !!matchedId;
      if (!matchedId) {
        var byName = state.items.filter(function (si) {
          return si.name.trim().toLowerCase() === it.xmlName.trim().toLowerCase();
        })[0];
        if (byName) matchedId = byName.id;
      }
      return {
        ean: it.ean,
        supplierCode: it.supplierCode,
        xmlName: it.xmlName,
        name: it.xmlName,
        unit: it.unit,
        qty: it.qty,
        unitValue: it.unitValue,
        min: 0,
        ideal: 0,
        category: state.categories[0] ? state.categories[0].key : "",
        itemChoice: matchedId || "__new__",
        autoMatched: autoMatched
      };
    });

    state.nfError = "";
    state.nfReview = { invoice: invoice, items: reviewItems };
    render();
  }

  function handleNfXmlFile(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var text = String(e.target.result || "");
      try {
        var parsed = parseNFeXml(text);
        prepareNfReview(parsed, text);
      } catch (err) {
        state.nfError = "Não foi possível ler essa nota fiscal: " + err.message;
        render();
      }
    };
    reader.onerror = function () {
      state.nfError = "Não foi possível ler o arquivo.";
      render();
    };
    reader.readAsText(file);
  }

  function downloadInvoiceXml(invoiceRow) {
    try {
      var blob = new Blob([invoiceRow.xmlContent || ""], { type: "application/xml" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "NFe-" + (invoiceRow.number || invoiceRow.id) + ".xml";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {}
  }

  function renderItemsListHTML(items) {

      .filter(function (it) { return it.name.toLowerCase().indexOf(search.toLowerCase()) !== -1; })
      .sort(function (a, b) {
        return order[getStatus(a)] - order[getStatus(b)] || a.name.localeCompare(b.name);

    return filtered.map(function (it) {

        '<div style="flex:1"><div class="est-row-name">' + esc(it.name) + '</div><div class="est-row-meta">' + esc(cat.label) + "</div></div>" +

  // ---------- Solicitar cadastro (público) e Administração da plataforma ----------

  var SEGMENTOS = ["Alimentação", "Saúde e clínicas", "Comércio", "Serviços", "Indústria", "Educação", "Outro"];

  function genPass() {
    var al = "abcdefghjkmnpqrstuvwxyz23456789", out = "";
    var arr = new Uint32Array(12);
    (window.crypto || window.msCrypto).getRandomValues(arr);
    for (var i = 0; i < 12; i++) { out += al.charAt(arr[i] % al.length); if (i === 3 || i === 7) out += "-"; }
    return out;
  }

  function phoneLink(phone) {
    var d = String(phone || "").replace(/\D/g, "");
    if (d.length <= 11) d = "55" + d;
    return "https://wa.me/" + d;
  }

  function fmtDateTime(s) {
    try { return new Date(s).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }); } catch (e) { return ""; }
  }

  function readSignupForm() {
    function v(id) { return ((document.getElementById(id) || {}).value || "").trim(); }
    return { nome: v("su-nome"), email: v("su-email"), telefone: v("su-tel"), empresa: v("su-empresa"), cnpj: v("su-cnpj"), cidade: v("su-cidade"), segmento: v("su-segmento"), mensagem: v("su-msg"), site: v("su-site") };
  }

  async function doSignupRequest() {
    if (state.signupBusy) return;
    var d = readSignupForm();
    state.signupDraft = d; state.signupError = "";
    if (d.nome.length < 3) { state.signupError = "Informe seu nome completo."; render(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) { state.signupError = "Informe um e-mail válido."; render(); return; }
    if (d.telefone.replace(/\D/g, "").length < 10) { state.signupError = "Informe um telefone com DDD."; render(); return; }
    if (d.empresa.length < 2) { state.signupError = "Informe o nome da empresa."; render(); return; }
    state.signupBusy = true; render();
    var res = await supabaseClient.rpc("solicitar_cadastro", { p_nome: d.nome, p_email: d.email, p_telefone: d.telefone, p_empresa: d.empresa, p_cnpj: d.cnpj, p_cidade: d.cidade, p_segmento: d.segmento, p_mensagem: d.mensagem, p_site: d.site });
    state.signupBusy = false;
    if (res.error) { state.signupError = res.error.message || "Não foi possível enviar. Tente novamente."; render(); return; }
    // avisa o dono da plataforma por e-mail (se o serviço estiver configurado); falha aqui não afeta quem solicitou
    try { supabaseClient.functions.invoke("notificar-solicitacoes", { body: {} }).catch(function () {}); } catch (e) {}
    state.signupDone = true; state.signupDraft = null; render();
  }

  function renderSignupForm() {
    var d = state.signupDraft || { nome: "", email: "", telefone: "", empresa: "", cnpj: "", cidade: "", segmento: "", mensagem: "" };
    function f(label, id, val, type, ph, auto) {
      return '<div class="est-login-field"><label class="est-label">' + label + '</label><input class="est-input" type="' + (type || "text") + '" id="' + id + '" value="' + esc(val) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : "") + (auto ? ' autocomplete="' + auto + '"' : "") + '/></div>';
    }
    var seg = '<option value="">Selecione</option>' + SEGMENTOS.map(function (s) { return '<option value="' + esc(s) + '"' + (d.segmento === s ? " selected" : "") + '>' + esc(s) + '</option>'; }).join("");
    return (state.signupError ? '<div class="est-login-msg est-login-error">' + esc(state.signupError) + '</div>' : '') +
      f("Nome completo *", "su-nome", d.nome, "text", "", "name") +
      f("E-mail *", "su-email", d.email, "email", "voce@empresa.com", "email") +
      f("Telefone / WhatsApp com DDD *", "su-tel", d.telefone, "tel", "(11) 91234-5678", "tel") +
      f("Nome da empresa *", "su-empresa", d.empresa, "text", "", "organization") +
      f("CNPJ (opcional)", "su-cnpj", d.cnpj, "text", "00.000.000/0000-00") +
      f("Cidade / UF", "su-cidade", d.cidade, "text", "São Paulo / SP") +
      '<div class="est-login-field"><label class="est-label">Segmento</label><select class="est-select" id="su-segmento" style="width:100%">' + seg + '</select></div>' +
      '<div class="est-login-field"><label class="est-label">Conte um pouco sobre sua necessidade (opcional)</label><textarea class="est-input" id="su-msg" rows="3" style="resize:vertical">' + esc(d.mensagem || "") + '</textarea></div>' +
      '<div style="position:absolute;left:-9999px;top:-9999px" aria-hidden="true"><input type="text" id="su-site" tabindex="-1" autocomplete="off"/></div>' +
      '<button class="est-btn est-btn-primary est-login-btn" data-action="signup-submit"' + (state.signupBusy ? " disabled" : "") + '>' + (state.signupBusy ? "Enviando…" : "Enviar solicitação") + '</button>' +
      '<div class="est-login-hint">Seus dados serão usados apenas para entrarmos em contato sobre o cadastro.</div>';
  }

  function renderLogin() {
    var signup = state.authMode === "signup";
    var tabs = '<div class="est-auth-tabs" role="tablist">' +
      '<button type="button" role="tab" aria-selected="' + (!signup) + '" class="est-auth-tab' + (!signup ? " active" : "") + '" data-action="auth-mode" data-id="login">Entrar</button>' +
      '<button type="button" role="tab" aria-selected="' + signup + '" class="est-auth-tab' + (signup ? " active" : "") + '" data-action="auth-mode" data-id="signup">Solicitar cadastro</button></div>';

  function platReset() {

      openCompany: null, users: [], usersError: "", personForm: null, confirm: null, renaming: null, msg: "" };

  async function platCall(fn, args) {
    var r = await supabaseClient.rpc(fn, args || {});
    if (r.error) return { ok: false, erro: r.error.message || "Não foi possível concluir." };
    return { ok: true, data: r.data };
  }

  async function loadPlatformData() {
    var a = await platCall("plataforma_solicitacoes");
    var b = await platCall("plataforma_empresas");
    if (!a.ok || !b.ok) { state.plat.error = "Não foi possível carregar: " + (a.erro || b.erro); return; }
    state.plat.error = "";
    state.plat.requests = a.data || [];
    state.plat.companies = b.data || [];
    state.lastUpdated = new Date();
  }

  async function platAction(action, id) {
    var p = state.plat;
    function val(i) { return ((document.getElementById(i) || {}).value || "").trim(); }
    p.msg = "";
    if (action === "plat-tab") { p.tab = id; p.formError = ""; render(); }
    else if (action === "plat-filter") { p.filter = id; render(); }
    else if (action === "plat-refresh") { await loadPlatformData(); render(); }
    else if (action === "plat-save-request") {
      var r = await platCall("plataforma_atualizar_solicitacao", { p_id: id, p_status: val("rq-status-" + id), p_notas: (document.getElementById("rq-notes-" + id) || {}).value || "" });
      if (!r.ok) p.error = r.erro; else { p.error = ""; await loadPlatformData(); p.msg = "Solicitação atualizada."; }
      render();
    }
    else if (action === "plat-new-company") {
      var rq = id ? p.requests.filter(function (x) { return x.id === id; })[0] : null;
      p.creating = { solicitacao: rq ? rq.id : null, empresa: rq ? rq.company_name : "", nome: rq ? rq.full_name : "", email: rq ? rq.email : "", senha: genPass() };
      p.formError = ""; p.tab = "empresas"; render();
    }
    else if (action === "plat-cancel-company") { p.creating = null; p.formError = ""; render(); }
    else if (action === "plat-gen-pass") {
      p.creating = { solicitacao: p.creating.solicitacao, empresa: val("nc-empresa"), nome: val("nc-nome"), email: val("nc-email"), senha: genPass() }; render();
    }
    else if (action === "plat-create-company") {
      if (p.busy) return;
      var d = { solicitacao: p.creating.solicitacao, empresa: val("nc-empresa"), nome: val("nc-nome"), email: val("nc-email"), senha: val("nc-senha") };
      p.creating = d; p.formError = "";
      if (d.empresa.length < 2) { p.formError = "Informe o nome da empresa."; render(); return; }
      if (!d.nome) { p.formError = "Informe o nome do administrador."; render(); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) { p.formError = "Informe um e-mail válido."; render(); return; }
      if (d.senha.length < 8) { p.formError = "A senha precisa ter ao menos 8 caracteres."; render(); return; }
      p.busy = true; render();
      var c1 = await platCall("plataforma_criar_empresa", { p_nome: d.empresa, p_solicitacao: d.solicitacao });
      if (!c1.ok) { p.busy = false; p.formError = c1.erro; render(); return; }
      var c2 = await callAdminUsers({ acao: "criar", company_id: c1.data, nome: d.nome, email: d.email, role: "admin", senha: d.senha });
      p.busy = false;
      await loadPlatformData();
      if (!c2.ok) {
        p.creating = null; p.openCompany = c1.data; await loadPlatUsers(c1.data);
        p.error = "A empresa foi criada, mas o administrador não: " + c2.erro + " Adicione-o em \"Pessoas\".";
        render(); return;
      }
      p.error = ""; p.creating = null; p.copiedCreated = false;
      p.created = { empresa: d.empresa, url: window.location.origin + window.location.pathname, email: d.email, senha: d.senha };
      render();
    }
    else if (action === "plat-dismiss-created") { p.created = null; render(); }
    else if (action === "plat-copy-created") {
      var c = p.created; if (!c) return;
      var txt = "STOCKAR — acesso da empresa " + c.empresa + "\nEndereço: " + c.url + "\nE-mail: " + c.email + "\nSenha provisória: " + c.senha + "\n(Troque a senha no primeiro acesso.)";
      try { await navigator.clipboard.writeText(txt); p.copiedCreated = true; } catch (e) { p.copiedCreated = false; }
      render();
    }
    else if (action === "plat-ask-toggle") { p.confirm = id; render(); }
    else if (action === "plat-cancel-confirm") { p.confirm = null; render(); }
    else if (action === "plat-toggle-active") {
      var comp = p.companies.filter(function (x) { return x.id === id; })[0];
      var t = await platCall("plataforma_set_ativa", { p_id: id, p_ativa: comp ? !comp.active : true });
      p.confirm = null; if (!t.ok) p.error = t.erro; else { p.error = ""; await loadPlatformData(); }
      render();
    }
    else if (action === "plat-rename") { p.renaming = id; render(); }
    else if (action === "plat-cancel-rename") { p.renaming = null; render(); }
    else if (action === "plat-save-rename") {
      var rn = await platCall("plataforma_renomear_empresa", { p_id: id, p_nome: val("rn-nome") });
      if (!rn.ok) p.error = rn.erro; else { p.error = ""; p.renaming = null; await loadPlatformData(); }
      render();
    }
    else if (action === "plat-open-company") {
      if (p.openCompany === id) { p.openCompany = null; p.personForm = null; render(); return; }
      p.openCompany = id; p.personForm = null; p.users = []; p.usersError = ""; p.confirm = null; render();
      await loadPlatUsers(id); render();
    }
    else if (action === "plat-add-person") { p.personForm = { id: "", nome: "", email: "", role: "editor", senha: genPass() }; p.formError = ""; render(); }
    else if (action === "plat-edit-person") {
      var u = p.users.filter(function (x) { return x.user_id === id; })[0]; if (!u) return;
      p.personForm = { id: id, nome: u.nome, email: u.email || "", role: u.role, senha: "" }; p.formError = ""; render();
    }
    else if (action === "plat-cancel-person") { p.personForm = null; p.formError = ""; render(); }
    else if (action === "plat-gen-pass-person") {
      p.personForm = { id: p.personForm.id, nome: val("pf-nome"), email: val("pf-email"), role: val("pf-role") || "editor", senha: genPass() }; render();
    }
    else if (action === "plat-save-person") {
      var f = { id: id || "", nome: val("pf-nome"), email: val("pf-email"), role: val("pf-role") || "editor", senha: val("pf-senha") };
      p.personForm = f; p.formError = "";
      if (!f.nome) { p.formError = "Informe o nome."; render(); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) { p.formError = "Informe um e-mail válido."; render(); return; }
      if (f.senha && f.senha.length < 8) { p.formError = "A senha precisa ter ao menos 8 caracteres."; render(); return; }
      if (!f.id && !f.senha) { p.formError = "Informe uma senha provisória."; render(); return; }
      var body = f.id ? { acao: "atualizar", company_id: p.openCompany, user_id: f.id, nome: f.nome, email: f.email, role: f.role, senha: f.senha }
                      : { acao: "criar", company_id: p.openCompany, nome: f.nome, email: f.email, role: f.role, senha: f.senha };
      var sv = await callAdminUsers(body);
      if (!sv.ok) { p.formError = sv.erro; render(); return; }
      p.personForm = null; await loadPlatUsers(p.openCompany); await loadPlatformData();
      p.msg = f.id ? "Pessoa atualizada." : "Pessoa criada. Envie o e-mail e a senha provisória: " + f.email + " / " + f.senha;
      render();
    }
    else if (action === "plat-ask-del-person") { p.confirm = "u:" + id; render(); }
    else if (action === "plat-del-person") {
      var dl = await callAdminUsers({ acao: "excluir", company_id: p.openCompany, user_id: id });
      p.confirm = null;
      if (!dl.ok) p.usersError = dl.erro; else { await loadPlatUsers(p.openCompany); await loadPlatformData(); }
      render();
    }
  }

  function matchesReportFilters(mv, f) {
    var d = localDateKey(new Date(mv.occurredAt));
    if (f.from && d < f.from) return false;
    if (f.to && d > f.to) return false;
    if (f.categoria && f.categoria !== "all" && mv.categoryKey !== f.categoria) return false;
    if (f.tipo && f.tipo !== "all" && mv.type !== f.tipo) return false;
    if (f.filial && f.filial !== "all" && mv.type === "saida" && mv.branch !== f.filial) return false;
    return true;
  }

    return { from: firstDayOfMonthKey(), to: todayKey(), filial: "all", categoria: "all", tipo: "all" };

  async function runAsOf() {
    var dateStr = (document.getElementById("asof-date") || {}).value || "";
    var end = asOfDateEnd(dateStr);
    state.asOf.date = dateStr;
    if (!end) { state.asOf.error = "Escolha uma data válida."; state.asOf.rows = null; render(); return; }
    state.asOf.busy = true; state.asOf.error = ""; render();
    var res = await supabaseClient.rpc("estoque_em_data", { p_ate: end.toISOString() });
    state.asOf.busy = false;
    if (res.error) { state.asOf.error = "Não foi possível calcular: " + res.error.message; state.asOf.rows = null; render(); return; }
    state.asOf.rows = (res.data || []).map(function (r) {
      return { id: r.r_item_id, nome: r.r_nome, categoria: r.r_categoria, unidade: r.r_unidade, qtd: Number(r.r_qtd) || 0, custoMedio: Number(r.r_custo_medio) || 0, temHistorico: !!r.r_tem_historico };
    });
    render();
  }

  function downloadAsOf() {

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ "Item": "" }]), "Estoque na data");
    try { XLSX.writeFile(wb, "estoque-em-" + state.asOf.date + ".xlsx"); } catch (e) {}
  }

  async function downloadPeriodExcel() {
    if (typeof XLSX === "undefined") {
      state.downloadMsg = { type: "error", text: "Não foi possível carregar a biblioteca de Excel. Verifique sua conexão com a internet e tente novamente." };
      render();
      return;
    }
    var f = readLogFilters();
    if (!f.from || !f.to) {
      state.downloadMsg = { type: "error", text: "Selecione o período (de/até) antes de baixar." };
      render();
      return;
    }
    var fromIso = new Date(f.from + "T00:00:00").toISOString();
    var toIso = new Date(f.to + "T23:59:59").toISOString();

    state.saving = true; render();
    var movRes = await supabaseClient.from("movements").select("*").gte("occurred_at", fromIso).lte("occurred_at", toIso).order("occurred_at", { ascending: false });
    var logRes = await supabaseClient.from("audit_log").select("*").gte("occurred_at", fromIso).lte("occurred_at", toIso).order("occurred_at", { ascending: false });
    state.saving = false;

    if (movRes.error || logRes.error) {
      state.downloadMsg = { type: "error", text: "Não foi possível buscar os dados do período selecionado." };
      render();
      return;
    }

    var movRows = (movRes.data || []).map(function (row) {
      return {
        "Data/hora": fmtDateTime(row.occurred_at),
        "Tipo": row.type === "entrada" ? "Entrada" : "Saída",
        "Item": row.item_name, "Categoria": row.category_key, "Unidade": row.unit,
        "Quantidade": Number(row.qty) || 0,
        "Valor unitário (R$)": Number(row.unit_value) || 0,
        "Valor total (R$)": Number(row.total_value) || 0,
        "Filial": row.branch || "", "Retirada": row.withdrawal_name || "", "Motivo": row.reason || "",
        "Registrado por": row.registered_by || ""
      };
    });
    var logRows = (logRes.data || []).map(function (row) {
      return {
        "Data/hora": fmtDateTime(row.occurred_at), "Ação": (AUDIT_ACTION_META[row.action] || {}).label || row.action,
        "Tipo": row.entity_type, "Descrição": row.description, "Executado por": row.performed_by || ""
      };
    });

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(movRows.length ? movRows : [{ "Data/hora": "" }]), "Movimentacoes");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logRows.length ? logRows : [{ "Data/hora": "" }]), "Log de auditoria");

    try {
      XLSX.writeFile(wb, "controle-de-estoque-" + f.from + "-a-" + f.to + ".xlsx");
      state.downloadMsg = { type: "success", text: "Download gerado com " + movRows.length + " movimentação(ões) e " + logRows.length + " registro(s) de log." };
    } catch (e) {
      state.downloadMsg = { type: "error", text: "Não foi possível gerar o arquivo Excel." };
    }
    render();
  }

  // ---------- backup completo ----------

  async function fetchAllRows(table, orderCol) {
    var all = [], from = 0, size = 1000;
    while (true) {
      var res = await supabaseClient.from(table).select("*").order(orderCol, { ascending: true }).range(from, from + size - 1);
      if (res.error) throw new Error(table + ": " + res.error.message);
      all = all.concat(res.data || []);
      if (!res.data || res.data.length < size) break;
      from += size;
    }
    return all;
  }

  async function downloadFullBackup() {
    state.downloadMsg = null; state.backupBusy = true; render();
    try {
      var spec = [["categories", "key"], ["branches", "key"], ["companies", "id"], ["profiles", "user_id"], ["items", "id"], ["movements", "id"],
        ["audit_log", "id"], ["invoices", "id"], ["item_supplier_links", "supplier_cnpj"]];
      var results = await Promise.all(spec.map(function (t) { return fetchAllRows(t[0], t[1]); }));
      var data = {};
      var counts = [];
      spec.forEach(function (t, i) {
        var rows = results[i];
        if (t[0] === "companies") rows = rows.map(function (u) { var c = {}; Object.keys(u).forEach(function (k) { if (k !== "dashboard_token") c[k] = u[k]; }); return c; });
        data[t[0]] = rows;
        counts.push(t[0] + ": " + rows.length);
      });
      var payload = { app: "STOCKAR", generated_at: new Date().toISOString(), generated_by: state.currentUser ? state.currentUser.username : null,
        note: "Backup completo. Senhas dos usuários não são incluídas.", data: data };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "stockar-backup-" + todayKey() + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      state.lastBackupAt = new Date();
      state.downloadMsg = { type: "success", text: "Backup baixado (" + counts.join(", ") + "). Guarde o arquivo em um lugar seguro, fora do Supabase." };
    } catch (e) {
      state.downloadMsg = { type: "error", text: "Não foi possível gerar o backup: " + (e && e.message ? e.message : "erro desconhecido") };
    }
    state.backupBusy = false;
    render();
  }

    var pct = state.dbSizeBytes != null ? (state.dbSizeBytes / DB_LIMIT_BYTES) * 100 : null;
    var fillClass = pct == null ? "" : (pct >= 90 ? "danger" : (pct >= 80 ? "warn" : ""));
    var storageBlock = '<div style="margin-bottom:26px">' +
      '<h2 class="est-h2">Armazenamento (Supabase)</h2>' +
      (pct == null ? '<div class="est-row-meta">Não foi possível obter o tamanho do banco agora.</div>' :
        ('<div class="est-row-meta">' + (state.dbSizeBytes / (1024 * 1024)).toFixed(1) + ' MB de 500 MB usados (' + pct.toFixed(1) + '% do limite gratuito do Supabase)</div>' +
          '<div class="est-storage-bar"><div class="est-storage-fill ' + fillClass + '" style="width:' + Math.min(100, pct).toFixed(1) + '%"></div></div>')) +
      '<div class="est-row-meta" style="margin-top:8px">Vercel (hospedagem): como este site é 100% estático, o consumo de banda é mínimo. Não é possível checar o uso do Vercel automaticamente aqui dentro sem expor uma chave secreta no navegador — confira de vez em quando em vercel.com → seu projeto → aba Usage.</div>' +
      "</div>";

    var lf = defaultLogFilters();
    var filterBar = '<div class="est-toolbar">' +
      '<div class="est-field"><label class="est-label">De</label><input class="est-input" type="date" id="log-from" value="' + lf.from + '" onchange="App.updateLog()"/></div>' +
      '<div class="est-field"><label class="est-label">Até</label><input class="est-input" type="date" id="log-to" value="' + lf.to + '" onchange="App.updateLog()"/></div>' +
      (isAdmin() ? '<button class="est-btn" data-action="download-period">' + ICON.download + " Baixar Excel do período</button>" : "") +
      "</div>";

    var msgBlock = msgBannerHTML(state.downloadMsg) + msgBannerHTML(state.purgeMsg);

    var backupBlock = "";
    if (isAdmin()) {
      backupBlock = '<div style="margin:4px 0 22px">' +
        '<div class="est-row-meta" style="margin-bottom:8px">Notas fiscais (XML) e registros fiscais devem ser guardados por pelo menos 5 anos. Baixe um backup completo de vez em quando e guarde fora do Supabase (as senhas dos usuários não entram no arquivo).</div>' +
        '<button class="est-btn" data-action="download-backup"' + (state.backupBusy ? " disabled" : "") + '>' + ICON.download + (state.backupBusy ? " Gerando backup…" : " Baixar backup completo") + "</button>" +
        (state.lastBackupAt ? '<span class="est-row-meta" style="margin-left:10px">Último backup nesta sessão: ' + timeStr(state.lastBackupAt) + "</span>" : "") +
        "</div>";
    }

    var purgeBlock = "";
    if (isAdmin()) {
      purgeBlock = '<div style="margin:4px 0 22px">' +
        '<div class="est-row-meta" style="margin-bottom:8px">Apagar remove definitivamente as movimentações e os registros deste log anteriores à data escolhida (os itens do estoque não são afetados). Use isso para não lotar o limite gratuito do banco. Para registros com menos de 5 anos, o app exige um backup completo baixado antes.</div>' +
        (!state.purgeConfirmPending ?
          ('<button class="est-btn" data-action="show-purge-confirm" style="border-color:#FCA5A5;color:#DC2626">' + ICON.trash + " Apagar dados antigos…</button>") :
          ('<div class="est-form" style="border-color:#FCA5A5;background:#FEF2F2">' +
            '<div class="est-field" style="max-width:220px;margin-bottom:10px"><label class="est-label">Apagar tudo anterior a</label><input class="est-input" type="date" id="purge-until" value="' + lf.to + '"/></div>' +
            '<div style="display:flex;gap:8px">' +
            '<button class="est-btn est-btn-primary" style="background:#DC2626;border-color:#DC2626" data-action="confirm-purge"' + (state.purging ? " disabled" : "") + '>' + ICON.check + (state.purging ? " Apagando…" : " Confirmar exclusão") + "</button>" +
            '<button class="est-btn" data-action="cancel-purge">' + ICON.x + " Cancelar</button>" +
            "</div></div>")) +
        "</div>";
    }

    return storageBlock + '<h2 class="est-h2">Log de auditoria</h2>' + filterBar + msgBlock + backupBlock + purgeBlock + '<div id="log-list">' + logContentHTML(lf) + "</div>";
  }

  // ---------- calendário ----------

  var WEEKDAY_LABELS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
  var MONTH_LABELS = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

  function renderCalendarPage() {
    var monthKey = state.calendarMonth || currentMonthKey();
    var parts = monthKey.split("-");
    var year = Number(parts[0]), month = Number(parts[1]) - 1;
    var firstWeekday = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();

    var dayCounts = {};
    state.movements.forEach(function (mv) {
      var d = new Date(mv.occurredAt);
      var key = localDateKey(d);
      if (key.slice(0, 7) !== monthKey) return;
      if (!dayCounts[key]) dayCounts[key] = { entrada: 0, saida: 0 };
      dayCounts[key][mv.type]++;
    });

    var header = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">' +
      '<h2 class="est-h2" style="margin:0">Calendário</h2>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
      '<button class="est-btn est-btn-ghost" data-action="cal-prev">' + ICON.back + "</button>" +
      '<span style="font-weight:700;min-width:150px;text-align:center;display:inline-block">' + MONTH_LABELS[month] + " " + year + "</span>" +
      '<button class="est-btn est-btn-ghost" data-action="cal-next" style="transform:rotate(180deg)">' + ICON.back + "</button>" +
      "</div></div>";

    var grid = '<div class="est-cal-grid">' +
      WEEKDAY_LABELS.map(function (w) { return '<div class="est-cal-daylabel">' + w + "</div>"; }).join("");

    for (var i = 0; i < firstWeekday; i++) grid += '<div class="est-cal-cell est-cal-cell-empty"></div>';
    for (var day = 1; day <= daysInMonth; day++) {
      var key = monthKey + "-" + pad2(day);
      var c = dayCounts[key];
      var isSelected = state.calendarSelectedDate === key;
      var isToday = key === todayKey();
      grid += '<div class="est-cal-cell' + (isSelected ? " active" : "") + (isToday ? " today" : "") + '" data-action="cal-select-day" data-id="' + key + '">' +
        '<div class="est-cal-daynum">' + day + "</div>" +
        (c ? ('<div class="est-cal-dots">' +
          (c.entrada ? '<span class="est-cal-dot est-cal-dot-in">' + c.entrada + "</span>" : "") +
          (c.saida ? '<span class="est-cal-dot est-cal-dot-out">' + c.saida + "</span>" : "") +
          "</div>") : "") +
        "</div>";
    }
    grid += "</div>";

    var details = "";
    if (state.calendarSelectedDate) {
      var dayMovs = state.movements.filter(function (mv) { return localDateKey(new Date(mv.occurredAt)) === state.calendarSelectedDate; })
        .sort(function (a, b) { return new Date(b.occurredAt) - new Date(a.occurredAt); });
      var dParts = state.calendarSelectedDate.split("-");
      var niceDate = dParts[2] + "/" + dParts[1] + "/" + dParts[0];
      details = '<h2 class="est-h2">Movimentações em ' + niceDate + "</h2>" +
        (dayMovs.length ? dayMovs.map(movementRowHTML).join("") : '<div class="est-empty">Nenhuma movimentação nesse dia.</div>');
    }

    return header + grid + '<div style="margin-top:20px">' + details + "</div>";
  }

  function renderSetupNeeded() {
    return '<div class="est-login-wrap"><div class="est-login-card" style="max-width:460px;text-align:left">' +
      '<div class="est-login-logo">' + LOGO_SVG + '</div>' +
      '<div class="est-login-title" style="text-align:center">Configuração do banco pendente</div>' +
      '<div class="est-login-sub" style="text-align:center">Este arquivo ainda não está ligado ao banco de dados compartilhado.</div>' +
      '<div class="est-login-msg est-login-error">Abra o arquivo HTML, encontre as constantes <b>SUPABASE_URL</b> e <b>SUPABASE_ANON_KEY</b> perto do início do &lt;script&gt; e cole os valores do seu projeto Supabase (Project Settings → API).</div>' +
      "</div></div>";
  }

  function changelogEntryHTML(entry, isLatest) {
    var itemsHTML = entry.items.map(function (txt) {
      return '<li style="margin:0 0 8px;line-height:1.5">' + esc(txt) + "</li>";
    }).join("");
    return '<div style="' + (isLatest ? "" : "padding-top:18px;margin-top:18px;border-top:1px solid #E5E7EB;") + '">' +
      '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px">' +
      '<span style="font-weight:700;font-size:15px;color:#1F2328">STOCKAR ' + esc(entry.version) + "</span>" +
      '<span style="font-size:12px;color:#8A8F98">' + esc(entry.date) + "</span>" +
      "</div>" +
      '<div style="font-weight:600;font-size:13.5px;color:#294534;margin-bottom:10px">' + esc(entry.title) + "</div>" +
      '<ul style="margin:0;padding-left:18px;font-size:13.5px;color:#3A3F46">' + itemsHTML + "</ul>" +
      "</div>";
  }

  function renderChangelogModal() {
    if (!CHANGELOG.length) return "";
    var latest = CHANGELOG[0];
    var older = CHANGELOG.slice(1, 4); // mostra no máximo as 3 atualizações anteriores
    var body = changelogEntryHTML(latest, true) + older.map(function (e) { return changelogEntryHTML(e, false); }).join("");
    return '<div style="position:fixed;inset:0;background:rgba(17,24,20,0.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px">' +
      '<div style="background:#fff;border-radius:14px;max-width:480px;width:100%;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.25)">' +
      '<div style="padding:22px 24px 16px;border-bottom:1px solid #F0F1F3">' +
      '<div style="font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#44882B;margin-bottom:4px">Novidades</div>' +
      '<div style="font-size:19px;font-weight:700;color:#1F2328">O que mudou no STOCKAR</div>' +
      "</div>" +
      '<div style="padding:20px 24px;overflow-y:auto">' + body + "</div>" +
      '<div style="padding:16px 24px;border-top:1px solid #F0F1F3;text-align:right">' +
      '<button class="est-btn est-btn-primary" data-action="dismiss-changelog">Entendi</button>' +
      "</div>" +
      "</div></div>";
  }

  function sidebarSectionHTML(key, title, bodyHTML) {
    var collapsed = !!state.menuCollapsed[key];
    return '<div class="est-sidebar-section' + (collapsed ? " est-collapsed" : "") + '">' +
      '<button type="button" class="est-sidebar-title est-collapsible" data-action="toggle-section" data-id="' + key + '" aria-expanded="' + (collapsed ? "false" : "true") + '">' +
      '<span>' + esc(title) + '</span>' +
      '<svg class="est-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></button>' +
      '<div class="est-sidebar-body">' + bodyHTML + '</div></div>';
  }

  function render() {
    var root = document.getElementById("root");
    if (!supabaseConfigured) {
      root.innerHTML = renderSetupNeeded();
      return;
    }
    if (!forceView && state.platform && state.plat) {
      root.innerHTML = renderPlatform();
      return;
    }
    if (!forceView && !state.currentUser) {
      root.innerHTML = renderLogin();
      return;
    }
    var showDashboardOnly = forceView || state.previewView;

    var topRow = "";
    if (!showDashboardOnly && state.currentUser) {
      topRow = '<div class="est-header-row">' +
        '<span class="est-user-chip">' + ICON.user + " " + esc(state.currentUser.username) + "</span>" +
        '<span class="est-role-badge">' + (isAdmin() ? "Administrador" : "Editor") + "</span>" +
        '<button class="est-btn" data-action="logout">' + ICON.logout + " Sair</button>" +
        "</div>";
    }

    var bottomRow = '<div class="est-header-row">';
    if (state.lastUpdated) bottomRow += '<span class="est-readonly-note est-num">Atualizado ' + timeStr(state.lastUpdated) + "</span>";
    if (state.saving) bottomRow += '<span class="est-readonly-note est-num">Salvando…</span>';
    bottomRow += '<button class="est-btn" data-action="refresh">' + ICON.refresh + " Atualizar</button>";
    if (!forceView && !state.previewView) {
      bottomRow += '<button class="est-btn" data-action="preview-on">' + ICON.eye + " Ver como painel</button>";
      bottomRow += '<button class="est-btn est-btn-primary" data-action="copy-link">' + ICON.copy + " " + (state.copied ? "Link copiado!" : "Copiar link do painel") + "</button>";
    }
    if (state.previewView && !forceView) {
      bottomRow += '<button class="est-btn" data-action="preview-off">' + ICON.back + " Voltar à gestão</button>";
    }
    bottomRow += "</div>";

    var headerRight = '<div class="est-header-right-col">' + topRow + bottomRow + "</div>";

    var hasLogo = !!(state.company && state.company.logoUrl && String(state.company.logoUrl).indexOf("data:image/") === 0);
    var brandName = (state.company && state.company.name) ? state.company.name : "";
    var companyLogoHTML = "";
    if (hasLogo) {
      companyLogoHTML = '<img class="est-company-logo" src="' + esc(state.company.logoUrl) + '" alt="Logo de ' + esc(brandName) + '"/>';
    } else if (!showDashboardOnly && isAdmin()) {
      companyLogoHTML = '<button type="button" class="est-logo-add" data-action="pick-header-logo" title="Adicionar o logo da sua empresa">' + ICON.upload + ' Adicionar logo</button>';
    }
    var companyEdit = (!showDashboardOnly && isAdmin() && hasLogo)
      ? '<button type="button" class="est-btn est-btn-ghost" data-action="pick-header-logo" title="Trocar o logo da empresa" aria-label="Trocar o logo da empresa">' + ICON.edit + '</button>' : "";
    var companyRow = (companyLogoHTML || brandName)
      ? '<div class="est-company">' + companyLogoHTML + (brandName ? '<div class="est-company-name">' + esc(brandName) + '</div>' : "") + companyEdit + "</div>" : "";
    var header = '<div class="est-header"><div class="est-brand"><div class="est-logo-mark">' + LOGO_SVG + '</div>' + companyRow +
      (showDashboardOnly ? '<div class="est-sub">Painel · somente leitura</div>' : "") +
      '<input type="file" id="header-logo-file" accept="image/png,image/jpeg,image/webp,image/svg+xml" style="display:none" tabindex="-1"/>' +
      "</div>" + headerRight + "</div>";

    var errorBanner = (!showDashboardOnly && state.globalError) ?
      ('<div class="est-login-msg est-login-error">' + esc(state.globalError) + "</div>") : "";
    var warningBanner = (!showDashboardOnly && state.storageWarning) ?
      ('<div class="est-warning-banner">' + esc(state.storageWarning) + "</div>") : "";

    var sidebar = "";
    if (!showDashboardOnly) {
      var estoqueItems = '<div class="est-sidebar-item' + (state.activeTab === "dashboard" ? " active" : "") + '" data-action="goto-cat" data-cat="dashboard">' + ICON.grid + " Dashboard</div>" +
        state.categories.map(function (c) {
          return '<div class="est-sidebar-item' + (state.activeTab === c.key ? " active" : "") + '" data-action="goto-cat" data-cat="' + c.key + '"><span class="est-dot" style="background:' + c.color + '"></span> ' + esc(c.label) + "</div>";
        }).join("");

      var relatoriosItems =
        '<div class="est-sidebar-item' + (state.activeTab === "relatorios" ? " active" : "") + '" data-action="goto-cat" data-cat="relatorios">' + ICON.report + " Relatórios</div>" +
        '<div class="est-sidebar-item' + (state.activeTab === "calendario" ? " active" : "") + '" data-action="goto-cat" data-cat="calendario">' + ICON.calendar + " Calendário</div>" +
        '<div class="est-sidebar-item' + (state.activeTab === "log" ? " active" : "") + '" data-action="goto-cat" data-cat="log">' + ICON.download + " Log &amp; armazenamento</div>";

      var adminItem = '<div class="est-sidebar-item' + (state.activeTab === "admin" ? " active" : "") + '" data-action="goto-cat" data-cat="admin">' + ICON.user + " " + (isAdmin() ? "Admin" : "Minha conta") + "</div>";

      sidebar = '<div class="est-sidebar">' +
        sidebarSectionHTML("estoque", "Estoque", estoqueItems) +
        sidebarSectionHTML("relatorios", "Relatórios Gerais", relatoriosItems) +
        '<div class="est-sidebar-section">' + adminItem + "</div>" +
        "</div>";
    }

    var main;
    if (state.loading) {
      main = '<div class="est-empty">Carregando estoque…</div>';
    } else if (state.nfReview && !showDashboardOnly) {
      main = renderNfReviewPage();
    } else if (forceView && state.publicError) {
      main = '<div class="est-empty">' + esc(state.publicError) + '</div>';
    } else if (showDashboardOnly) {
      main = renderDashboard(state.items, false);
    } else if (state.activeTab === "dashboard") {
      main = renderDashboard(state.items, true);
    } else if (state.activeTab === "admin") {
      main = renderAdminPage();
    } else if (state.activeTab === "relatorios") {
      main = renderReportsPage();
    } else if (state.activeTab === "calendario") {
      main = renderCalendarPage();
    } else if (state.activeTab === "log") {
      main = renderLogPage();
    } else {
      main = renderCategoryPage(state.activeTab);
    }

    var contentInner = errorBanner + warningBanner + '<div class="est-main">' + main + "</div>";

    var changelogModal = (state.showChangelog && !showDashboardOnly && state.currentUser) ? renderChangelogModal() : "";

    if (showDashboardOnly) {
      root.innerHTML = '<div class="est-wrap">' + header + contentInner + "</div>" + changelogModal;
    } else {
      root.innerHTML = '<div class="est-wrap">' + header + '<div class="est-shell">' + sidebar + '<div class="est-content">' + contentInner + "</div></div></div>" + changelogModal;
    }

    if ((showDashboardOnly || state.activeTab === "dashboard") && !state.loading) {
      var listEl = document.getElementById("items-list");
      if (listEl) listEl.innerHTML = renderItemsListHTML(state.items);
    }
  }

  // ---------- actions ----------

  var App = {
    filterDashboard: function () {
      var listEl = document.getElementById("items-list");
      if (listEl) listEl.innerHTML = renderItemsListHTML(state.items);
    },
    updateReport: function () {
      var el = document.getElementById("report-content");
      if (el) el.innerHTML = reportContentHTML();
    },
    updateLog: function () {
      var el = document.getElementById("log-list");
      if (el) el.innerHTML = logContentHTML();
    },
    changeNfReviewItem: function (idx) {
      if (!state.nfReview) return;
      syncAllNfReviewRows();
      var choiceEl = document.getElementById("nf-choice-" + idx);
      if (choiceEl) state.nfReview.items[idx].itemChoice = choiceEl.value;
      render();
    }
  };
  window.App = App;

  document.addEventListener("click", async function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    var cat = el.getAttribute("data-cat");

    if (action === "login-submit") {
      doLogin();
    } else if (action === "auth-mode") {
      state.authMode = id === "signup" ? "signup" : "login"; state.signupError = ""; state.loginError = ""; if (id !== "signup") state.signupDone = false; render();
    } else if (action === "signup-submit") {
      doSignupRequest();
    } else if (action.indexOf("plat-") === 0) {
      if (!state.platform) return;
      platAction(action, id);
    } else if (action === "logout") {
      doLogout();
    } else if (action === "save-password") {
      doChangePassword();
    } else if (action === "show-add-user") {
      if (!isAdmin()) return;
      state.addingUser = true; state.editingUserId = null; state.userFormError = ""; state.userDraft = null; render();
    } else if (action === "cancel-user-form") {
      state.addingUser = false; state.editingUserId = null; state.userFormError = ""; state.userDraft = null; render();
    } else if (action === "edit-user") {
      if (!isAdmin()) return;
      state.editingUserId = id; state.addingUser = false; state.userFormError = ""; state.userDraft = null; render();
    } else if (action === "save-user") {
      if (!isAdmin()) return;
      var nameVal = ((document.getElementById("uf-username") || {}).value || "").trim();
      var emailVal = ((document.getElementById("uf-email") || {}).value || "").trim();
      var roleVal = (document.getElementById("uf-role") || {}).value || "editor";
      var passVal = (document.getElementById("uf-password") || {}).value || "";
      state.userDraft = { id: id || "", username: nameVal, email: emailVal, role: roleVal };
      state.userFormError = "";
      if (!nameVal) { state.userFormError = "Informe o nome da pessoa."; render(); return; }
      if (!emailVal) { state.userFormError = "Informe o e-mail da pessoa."; render(); return; }
      if (passVal && passVal.length < 8) { state.userFormError = "A senha precisa ter ao menos 8 caracteres."; render(); return; }
      if (id) {
        var target = findUserById(id);
        if (!target) { state.addingUser = false; state.editingUserId = null; render(); return; }
        if (target.role === "admin" && roleVal !== "admin") {
          var adminCount1 = state.users.filter(function (u) { return u.role === "admin"; }).length;
          if (adminCount1 <= 1) { state.userFormError = "Não é possível remover o último administrador."; render(); return; }
        }
        state.saving = true; render();
        var uRes = await callAdminUsers({ acao: "atualizar", user_id: id, nome: nameVal, email: emailVal, role: roleVal, senha: passVal });
        state.saving = false;
        if (!uRes.ok) { state.userFormError = uRes.erro; render(); return; }
        await loadUsers();
        if (state.currentUser && state.currentUser.id === id) {
          state.currentUser.username = nameVal; state.currentUser.role = roleVal; state.currentUser.email = emailVal.toLowerCase();
        }
        state.editingUserId = null; state.userDraft = null;
        render();
      } else {
        if (!passVal) { state.userFormError = "Informe uma senha provisória (mínimo 8 caracteres)."; render(); return; }
        state.saving = true; render();
        var cRes = await callAdminUsers({ acao: "criar", nome: nameVal, email: emailVal, role: roleVal, senha: passVal });
        state.saving = false;
        if (!cRes.ok) { state.userFormError = cRes.erro; render(); return; }
        await loadUsers();
        state.addingUser = false; state.userDraft = null;
        render();
      }
    } else if (action === "delete-user") {
      if (!isAdmin()) return;
      if (state.currentUser && state.currentUser.id === id) return;
      var delTarget = findUserById(id);
      if (!delTarget) return;
      if (delTarget.role === "admin") {
        var adminCount2 = state.users.filter(function (u) { return u.role === "admin"; }).length;
        if (adminCount2 <= 1) { state.userFormError = "Não é possível excluir o último administrador."; render(); return; }
      }
      state.saving = true; render();
      var dRes = await callAdminUsers({ acao: "excluir", user_id: id });
      state.saving = false;
      if (!dRes.ok) { state.userFormError = dRes.erro; render(); return; }
      state.users = state.users.filter(function (u) { return u.id !== id; });
      render();
    } else if (action === "goto-cat") {
      state.activeTab = cat;
      state.adding = false;
      state.editingId = null;
      state.passwordError = "";
      state.passwordSuccess = false;
      state.addingUser = false;
      state.editingUserId = null;
      state.addingCategory = false;
      state.categoryFormError = "";
      state.importMsg = null;
      state.movementItemId = null;
      state.movementType = null;
      state.movementError = "";
      state.addingBranch = false;
      state.branchFormError = "";

  // Reduz a imagem do logo para caber leve no banco (máx. 320x160 px).
  function brandLogoFail(auto, text) {
    if (auto) state.globalError = text; else state.brandMsg = { type: "error", text: text };
    render();

  async function saveLogoNow(dataUrl) {
    if (!state.company) return;
    state.saving = true; render();
    var r = await supabaseClient.from("companies").update({ logo_url: dataUrl }).eq("id", state.company.id);
    state.saving = false;
    if (r.error) { state.globalError = "Não foi possível salvar o logo: " + r.error.message; render(); return; }
    state.company.logoUrl = dataUrl; state.globalError = "";
    render();
  }

  function handleBrandLogo(file, auto) {
    if (file.size > 3 * 1024 * 1024) { brandLogoFail(auto, "Imagem muito grande. Use um arquivo de até 3 MB."); return; }
    var nameNow = ((document.getElementById("brand-name") || {}).value || (state.company ? state.company.name : ""));
    var reader = new FileReader();
    reader.onerror = function () { brandLogoFail(auto, "Não foi possível ler a imagem."); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { brandLogoFail(auto, "Esse arquivo não parece ser uma imagem válida."); };
      img.onload = function () {
        var maxW = 320, maxH = 160;
        var ratio = Math.min(maxW / (img.width || maxW), maxH / (img.height || maxH), 1);
        var w = Math.max(1, Math.round((img.width || maxW) * ratio)), h = Math.max(1, Math.round((img.height || maxH) * ratio));
        var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        var out = cv.toDataURL("image/png");
        if (out.length > 250000) out = cv.toDataURL("image/jpeg", 0.85);
        if (out.length > 250000) { brandLogoFail(auto, "A imagem continua grande demais. Tente uma imagem mais simples."); return; }
        if (auto) { saveLogoNow(out); return; }
        state.brandDraft = { name: nameNow, logoUrl: out }; state.brandMsg = null; render();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  // Evita que uma atualização automática em segundo plano apague o que
  // a pessoa está digitando (busca, formulário de item/movimentação
  // aberto, etc.) — nesses casos, a atualização é adiada, não perdida.
  function shouldSkipAutoRefresh() {
    var ae = document.activeElement;
    if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT")) return true;
    if (state.saving || state.loading || state.nfSaving) return true;
    if (state.adding || state.editingId || state.movementItemId || state.addingCategory || state.addingBranch || state.purgeConfirmPending || state.nfReview) return true;
    return false;
  }

  // ---------- atualização em tempo real (Supabase Realtime) ----------
  // Sempre que alguém (em qualquer computador/celular) adiciona, edita
  // ou exclui algo, o Supabase avisa este app na hora e a tela é
  // atualizada sozinha, sem precisar clicar em "Atualizar".
  var realtimeRefreshTimer = null;
  function scheduleRealtimeRefresh() {
    if (realtimeRefreshTimer) clearTimeout(realtimeRefreshTimer);
    realtimeRefreshTimer = setTimeout(function tryRealtimeRefresh() {
      if (shouldSkipAutoRefresh()) { realtimeRefreshTimer = setTimeout(tryRealtimeRefresh, 3000); return; }
      realtimeRefreshTimer = null;
      refreshAllData().then(render);
    }, 700);
  }

  function stopRealtime() {
    try { if (supabaseClient) supabaseClient.removeAllChannels(); } catch (e) {}
    realtimeStarted = false;
  }

  function startRealtime() {
    if (!supabaseClient || realtimeStarted) return;
    realtimeStarted = true;
    var channel = supabaseClient.channel("estoque-live-changes");
    ["items", "movements", "categories", "branches", "audit_log", "invoices"].forEach(function (t) {
      channel.on("postgres_changes", { event: "*", schema: "public", table: t }, scheduleRealtimeRefresh);
    });
    channel.subscribe();
  }

  // Painel público (somente leitura): protegido por um código secreto da
  // empresa na própria URL (?view=dashboard&t=...). Não exige login.
  async function loadPublicDashboard() {
    var token = "";
    try { token = new URLSearchParams(window.location.search).get("t") || ""; } catch (e) {}
    if (!token) { state.publicError = "Este link do painel não é mais válido. Peça um novo link ao administrador."; state.loading = false; return; }
    var res = await supabaseClient.rpc("painel_publico", { p_token: token });
    if (res.error || !res.data) { state.publicError = "Este link do painel não é mais válido. Peça um novo link ao administrador."; state.loading = false; return; }
    state.publicError = "";
    state.items = (res.data.items || []).map(mapItemFromDb);
    state.categories = res.data.categories || [];
    var c = res.data.company || {};
    state.company = { id: null, name: c.name || "", logoUrl: c.logo_url || null, token: null };
    state.loading = false;
    state.lastUpdated = new Date();
  }

  async function initApp() {
    if (!supabaseConfigured) { state.loading = false; render(); return; }
    state.calendarMonth = currentMonthKey();

    if (forceView) {
      await loadPublicDashboard();
      render();
      setInterval(async function () { await loadPublicDashboard(); render(); }, 20000);
      return;
    }

    supabaseClient.auth.onAuthStateChange(function (ev) {
      if (ev === "SIGNED_OUT" && (state.currentUser || state.platform)) resetAfterLogout();
    });

    var ok = await loadProfile();
    if (ok && state.platform) {
      platReset(); await loadPlatformData(); startPlatformPolling();
    } else if (ok) {
      await refreshAllData();
      checkChangelog();
      startRealtime();
    } else {
      try { await supabaseClient.auth.signOut(); } catch (e) {}
    }
    state.loading = false;
    render();
  }

  initApp();
})();
</script>
