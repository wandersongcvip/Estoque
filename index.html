<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Controle de Estoque</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  body { margin:0; }
  .est-wrap { font-family:'Manrope', ui-sans-serif, system-ui, sans-serif; background:#F6F7F9; min-height:100vh; color:#1E2430; }
  .est-num { font-family:'Manrope', ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; font-weight:700; }
  .est-header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 22px; border-bottom:1px solid #E5E7EB; background:#FFFFFF; flex-wrap:wrap; }
  .est-brand { display:flex; align-items:center; gap:10px; }
  .est-logo-mark { height:26px; display:flex; align-items:center; flex-shrink:0; }
  .est-title { font-size:16px; font-weight:800; letter-spacing:-0.01em; }
  .est-sub { font-size:12px; color:#6B7280; margin-top:1px; }
  .est-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:8px; font-size:13px; font-weight:500; border:1px solid #E5E7EB; background:#fff; color:#1E2430; cursor:pointer; transition:background .15s ease, border-color .15s ease; white-space:nowrap; font-family:inherit; }
  .est-btn:hover { background:#F6F7F9; }
  .est-btn-primary { background:#4F46E5; border-color:#4F46E5; color:#fff; }
  .est-btn-primary:hover { background:#4338CA; }
  .est-btn-ghost { border-color:transparent; background:transparent; padding:6px 8px; }
  .est-btn-ghost:hover { background:#F1F2F4; }
  .est-btn:disabled { opacity:.45; cursor:not-allowed; }
  .est-nav { display:flex; gap:4px; padding:10px 22px; overflow-x:auto; background:#FFFFFF; border-bottom:1px solid #E5E7EB; }
  .est-nav-item { display:flex; align-items:center; gap:7px; padding:8px 13px; border-radius:8px; font-size:13px; font-weight:500; color:#4B5563; cursor:pointer; white-space:nowrap; border:1px solid transparent; }
  .est-nav-item:hover { background:#F6F7F9; }
  .est-nav-item.active { background:#EEF2FF; color:#1E2430; border-color:#E0E7FF; }
  .est-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; display:inline-block; }
  .est-shell { display:flex; align-items:stretch; }
  .est-sidebar { width:228px; flex-shrink:0; background:#FFFFFF; border-right:1px solid #E5E7EB; padding:16px 10px; overflow-y:auto; }
  .est-sidebar-section { margin-bottom:20px; }
  .est-sidebar-section:last-child { margin-bottom:0; }
  .est-sidebar-title { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:#9CA3AF; padding:0 10px; margin-bottom:6px; }
  .est-sidebar-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; font-size:13px; font-weight:500; color:#4B5563; cursor:pointer; white-space:nowrap; border:1px solid transparent; margin-bottom:2px; }
  .est-sidebar-item:hover { background:#F6F7F9; }
  .est-sidebar-item.active { background:#EEF2FF; color:#1E2430; border-color:#E0E7FF; }
  .est-content { flex:1; min-width:0; }
  .est-header-right-col { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .est-header-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .est-main { max-width:960px; margin:0 auto; padding:24px 22px 60px; }
  .est-storage-bar { height:8px; border-radius:6px; background:#EDEEF1; overflow:hidden; margin:8px 0; }
  .est-storage-fill { height:100%; border-radius:6px; background:#16A34A; transition:width .2s ease; }
  .est-storage-fill.warn { background:#D97706; }
  .est-storage-fill.danger { background:#DC2626; }
  .est-warning-banner { font-size:12.5px; border-radius:7px; padding:9px 12px; margin-bottom:14px; color:#92400E; background:#FFFBEB; border:1px solid #FDE68A; }
  .est-h2 { font-size:15px; font-weight:600; margin:0 0 12px; }
  .est-tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:26px; }
  .est-tile { background:#fff; border:1px solid #E5E7EB; border-left:3px solid; border-radius:9px; padding:14px 16px; }
  .est-tile-num { font-size:28px; font-weight:600; line-height:1.1; }
  .est-tile-label { font-size:12.5px; color:#6B7280; margin-top:4px; }
  .est-catgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px; margin-bottom:28px; }
  .est-catcard { background:#fff; border:1px solid #E5E7EB; border-radius:9px; padding:12px 14px; cursor:pointer; transition:border-color .15s ease; }
  .est-catcard:hover { border-color:#C7CAD1; }
  .est-catcard-top { display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:500; margin-bottom:8px; }
  .est-catcard-counts { display:flex; gap:12px; font-size:12.5px; }
  .est-row { display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid #EDEEF1; }
  .est-row:last-child { border-bottom:none; }
  .est-row-name { font-size:13.5px; font-weight:500; }
  .est-row-meta { font-size:12px; color:#8A8F98; margin-top:1px; }
  .est-badge { font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .est-input { border:1px solid #DADDE2; border-radius:7px; padding:7px 10px; font-size:13px; font-family:inherit; background:#fff; width:100%; }
  .est-input:focus { outline:2px solid #C7D2FE; border-color:#4F46E5; }
  .est-label { font-size:11.5px; color:#6B7280; margin-bottom:4px; display:block; }
  .est-field { flex:1; min-width:110px; }
  .est-form { background:#FAFAFB; border:1px solid #E5E7EB; border-radius:9px; padding:16px; margin-bottom:16px; }
  .est-form-grid { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .est-stepper { display:flex; align-items:center; gap:4px; }
  .est-stepper input { width:46px; text-align:center; border:1px solid #DADDE2; border-radius:6px; padding:6px 2px; font-size:13px; font-family:'IBM Plex Mono',monospace; }
  .est-empty { text-align:center; padding:40px 20px; color:#8A8F98; font-size:13.5px; }
  .est-search { display:flex; align-items:center; gap:8px; border:1px solid #DADDE2; border-radius:8px; padding:8px 12px; background:#fff; flex:1; min-width:180px; }
  .est-search input { border:none; outline:none; font-size:13px; width:100%; font-family:inherit; }
  .est-select { border:1px solid #DADDE2; border-radius:8px; padding:8px 10px; font-size:13px; background:#fff; font-family:inherit; }
  .est-toolbar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .est-readonly-note { font-size:12px; color:#6B7280; }
  .ic { display:inline-flex; }
  .est-login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F6F7F9; padding:20px; }
  .est-login-card { background:#fff; border:1px solid #E5E7EB; border-radius:12px; padding:32px 28px; width:100%; max-width:360px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .est-login-logo { height:28px; margin-bottom:18px; display:flex; justify-content:center; }
  .est-login-title { font-size:16px; font-weight:800; text-align:center; margin-bottom:4px; }
  .est-login-sub { font-size:12.5px; color:#6B7280; text-align:center; margin-bottom:20px; }
  .est-login-field { margin-bottom:12px; }
  .est-login-msg { font-size:12.5px; border-radius:7px; padding:8px 10px; margin-bottom:14px; }
  .est-login-error { color:#DC2626; background:#FEF2F2; border:1px solid #FECACA; }
  .est-login-success { color:#16A34A; background:#F0FDF4; border:1px solid #BBF7D0; }
  .est-login-btn { width:100%; justify-content:center; padding:9px 13px; }
  .est-login-hint { font-size:11.5px; color:#9CA3AF; text-align:center; margin-top:16px; }
  .est-role-badge { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:20px; background:#EEF2FF; color:#4F46E5; white-space:nowrap; }
  .est-user-chip { font-size:12.5px; color:#4B5563; white-space:nowrap; }
  .est-cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .est-cal-daylabel { font-size:11px; font-weight:700; color:#8A8F98; text-align:center; padding-bottom:4px; }
  .est-cal-cell { min-height:64px; border:1px solid #E5E7EB; border-radius:8px; padding:6px; cursor:pointer; background:#fff; }
  .est-cal-cell-empty { border:none; cursor:default; background:transparent; }
  .est-cal-cell:hover { border-color:#B9BFC9; }
  .est-cal-cell.today { border-color:#4F46E5; }
  .est-cal-cell.active { background:#EEF2FF; border-color:#4F46E5; }
  .est-cal-daynum { font-size:12.5px; font-weight:700; color:#2A2E35; }
  .est-cal-dots { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
  .est-cal-dot { font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:20px; }
  .est-cal-dot-in { background:#F0FDF4; color:#16A34A; }
  .est-cal-dot-out { background:#FEF2F2; color:#DC2626; }
</style>

    for (var i = 0; i < str.length; i++) {

    return h.toString(16) + "_" + str.length.toString(16);
  }

  async function doChangePassword() {
    if (!state.currentUser) return;
    var cur = (document.getElementById("chpwd-current") || {}).value || "";
    var nw = (document.getElementById("chpwd-new") || {}).value || "";
    var conf = (document.getElementById("chpwd-confirm") || {}).value || "";
    state.passwordSuccess = false;
    if (hashPass(cur) !== state.currentUser.passwordHash) {
      state.passwordError = "Senha atual incorreta.";
      render();
      return;
    }
    if (!nw || nw.length < 4) {
      state.passwordError = "A nova senha deve ter ao menos 4 caracteres.";
      render();
      return;
    }
    if (nw !== conf) {
      state.passwordError = "As senhas novas não coincidem.";
      render();
      return;
    }
    state.saving = true; render();
    var newHash = hashPass(nw);
    var res = await supabaseClient.from("users").update({ password_hash: newHash }).eq("id", state.currentUser.id);
    state.saving = false;
    if (res.error) {
      state.passwordError = "Não foi possível salvar a nova senha: " + res.error.message;
      render();
      return;
    }
    var u = findUserById(state.currentUser.id);
    if (u) { u.passwordHash = newHash; state.currentUser = u; }
    state.passwordError = "";
    state.passwordSuccess = true;
    render();
  }

  // ---------- planilhas Excel ----------

  function safeSheetName(name, used) {
    var s = String(name == null ? "" : name).replace(/[\\\/\?\*\[\]:]/g, "").trim();
    if (!s) s = "Categoria";
    if (s.length > 31) s = s.slice(0, 31);
    var base = s, n = 2;
    while (used[s]) {
      var suf = "-" + n;
      s = base.slice(0, 31 - suf.length) + suf;
      n++;
    }
    return s;
  }

  function exportExcel() {
    if (typeof XLSX === "undefined") {
      state.importMsg = { type: "error", text: "Não foi possível carregar a biblioteca de Excel. Verifique sua conexão com a internet e tente novamente." };
      render();
      return;
    }
    var wb = XLSX.utils.book_new();
    var catRows = state.categories.map(function (c) { return { Categoria: c.label, Cor: c.color }; });
    var catWs = XLSX.utils.json_to_sheet(catRows.length ? catRows : [{ Categoria: "", Cor: "" }]);
    XLSX.utils.book_append_sheet(wb, catWs, "Categorias");

    var usedNames = { "Categorias": true };
    state.categories.forEach(function (c) {
      var items = state.items.filter(function (it) { return it.category === c.key; });
      var rows = items.map(function (it) {
        return {
          "Nome": it.name,
          "Unidade": it.unit,
          "Quantidade atual": Number(it.qty) || 0,
          "Nível baixo até": Number(it.min) || 0,
          "Nível OK a partir de": Number(it.ideal) || 0,
          "Valor médio (R$)": Number(it.avgCost) || 0
        };
      });
      var ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ "Nome": "", "Unidade": "", "Quantidade atual": "", "Nível baixo até": "", "Nível OK a partir de": "", "Valor médio (R$)": "" }]);
      var sheetName = safeSheetName(c.label, usedNames);
      usedNames[sheetName] = true;
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });

    try {
      XLSX.writeFile(wb, "controle-de-estoque.xlsx");
    } catch (e) {
      state.importMsg = { type: "error", text: "Não foi possível gerar o arquivo Excel." };
      render();
    }
  }

  function handleImportFile(file) {
    if (typeof XLSX === "undefined") {
      state.importMsg = { type: "error", text: "Não foi possível carregar a biblioteca de Excel. Verifique sua conexão com a internet e tente novamente." };
      render();
      return;
    }
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, { type: "array" });
        importWorkbook(wb);
      } catch (err) {
        state.importMsg = { type: "error", text: "Não foi possível ler o arquivo. Verifique se é uma planilha Excel válida." };
        render();
      }
    };
    reader.onerror = function () {
      state.importMsg = { type: "error", text: "Não foi possível ler o arquivo." };
      render();
    };
    reader.readAsArrayBuffer(file);
  }

  async function importWorkbook(wb) {
    var stats = { categoriasNovas: 0, itensNovos: 0, itensAtualizados: 0, linhasIgnoradas: 0 };
    var admin = isAdmin();
    var newItemRows = [];
    var updateOps = [];

    if (wb.SheetNames.indexOf("Categorias") !== -1) {
      var catRows = XLSX.utils.sheet_to_json(wb.Sheets["Categorias"], { defval: "" });
      for (var ci = 0; ci < catRows.length; ci++) {
        var row0 = catRows[ci];
        var label = String(row0["Categoria"] || "").trim();
        if (!label) continue;
        if (findCategoryByLabel(label)) continue;
        if (!admin) { stats.linhasIgnoradas++; continue; }
        var color = String(row0["Cor"] || "").trim();
        if (!/^#[0-9a-fA-F]{6}$/.test(color)) color = "#6B7280";
        var newCat = { key: uniqueCategoryKey(slugify(label)), label: label, color: color };
        var catRes = await insertCategory(newCat);
        if (!catRes.error) { state.categories.push(newCat); stats.categoriasNovas++; }
      }
    }

    for (var si = 0; si < wb.SheetNames.length; si++) {
      var sheetName = wb.SheetNames[si];
      if (sheetName === "Categorias") continue;
      var cat = findCategoryByLabel(sheetName);
      if (!cat) {
        if (!admin) { stats.linhasIgnoradas++; continue; }
        cat = { key: uniqueCategoryKey(slugify(sheetName)), label: sheetName, color: "#6B7280" };
        var catRes2 = await insertCategory(cat);
        if (catRes2.error) { stats.linhasIgnoradas++; continue; }
        state.categories.push(cat);
        stats.categoriasNovas++;
      }
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: "" });
      for (var ri = 0; ri < rows.length; ri++) {
        var row = rows[ri];
        var name = String(row["Nome"] || "").trim();
        if (!name) { stats.linhasIgnoradas++; continue; }
        var unit = String(row["Unidade"] || "un").trim() || "un";
        var qty = Number(row["Quantidade atual"]) || 0;
        var min = Number(row["Nível baixo até"]) || 0;
        var ideal = Number(row["Nível OK a partir de"]) || 0;
        var importedAvgCost = Number(row["Valor médio (R$)"]) || 0;
        var existingItem = null;
        for (var i = 0; i < state.items.length; i++) {
          if (state.items[i].category === cat.key && state.items[i].name.trim().toLowerCase() === name.toLowerCase()) { existingItem = state.items[i]; break; }
        }
        if (existingItem) {
          updateOps.push(supabaseClient.from("items").update({ unit: unit, qty: qty, min: min, ideal: ideal }).eq("id", existingItem.id).then(function (res) {
            if (!res.error) stats.itensAtualizados++; else stats.linhasIgnoradas++;
          }));
          existingItem.unit = unit; existingItem.qty = qty; existingItem.min = min; existingItem.ideal = ideal;
        } else {
          newItemRows.push({ jsItem: { id: uid(), category: cat.key, name: name, unit: unit, qty: qty, min: min, ideal: ideal, avgCost: importedAvgCost } });
        }
      }
    }

    if (newItemRows.length) {
      var dbRows = newItemRows.map(function (n) {
        return { id: n.jsItem.id, category: n.jsItem.category, name: n.jsItem.name, unit: n.jsItem.unit, qty: n.jsItem.qty, min: n.jsItem.min, ideal: n.jsItem.ideal, avg_cost: n.jsItem.avgCost };
      });
      var insertRes = await supabaseClient.from("items").insert(dbRows);
      if (!insertRes.error) {
        newItemRows.forEach(function (n) { state.items.push(n.jsItem); stats.itensNovos++; });
      } else {
        stats.linhasIgnoradas += newItemRows.length;
      }
    }
    await Promise.all(updateOps);

    var parts = [];
    if (stats.categoriasNovas) parts.push(stats.categoriasNovas + " categoria(s) criada(s)");
    parts.push(stats.itensNovos + " item(ns) criado(s)");
    parts.push(stats.itensAtualizados + " item(ns) atualizado(s)");
    if (stats.linhasIgnoradas) parts.push(stats.linhasIgnoradas + " linha(s) ignorada(s)");
    state.importMsg = { type: "success", text: "Importação concluída: " + parts.join(", ") + "." };
    render();
  }

      '<div class="est-field" style="flex-basis:90px;min-width:70px"><label class="est-label">Cor</label><input class="est-input" type="color" id="cf-color" value="#4F46E5" style="padding:2px;height:33px"/></div>' +
      "</div>" +
      '<div style="display:flex;gap:8px">' +
      '<button class="est-btn est-btn-primary" data-action="save-category">' + ICON.check + " Salvar</button>" +
      '<button class="est-btn" data-action="cancel-category-form">' + ICON.x + " Cancelar</button>" +
      "</div></div>";

  function renderDashboard(items, navigable) {
    var counts = { baixo: 0, medio: 0, ok: 0 };
    items.forEach(function (it) { counts[getStatus(it)]++; });

    var byCat = {};
    state.categories.forEach(function (c) { byCat[c.key] = { baixo: 0, medio: 0, ok: 0, total: 0 }; });
    items.forEach(function (it) {
      if (!byCat[it.category]) return;
      byCat[it.category][getStatus(it)]++;
      byCat[it.category].total++;
    });

    var tiles =
      '<div class="est-tiles">' +
      '<div class="est-tile" style="border-left-color:' + STATUS_META.baixo.color + '"><div class="est-tile-num est-num" style="color:' + STATUS_META.baixo.color + '">' + counts.baixo + '</div><div class="est-tile-label">Itens em nível baixo</div></div>' +
      '<div class="est-tile" style="border-left-color:' + STATUS_META.medio.color + '"><div class="est-tile-num est-num" style="color:' + STATUS_META.medio.color + '">' + counts.medio + '</div><div class="est-tile-label">Itens em nível médio</div></div>' +
      '<div class="est-tile" style="border-left-color:' + STATUS_META.ok.color + '"><div class="est-tile-num est-num" style="color:' + STATUS_META.ok.color + '">' + counts.ok + '</div><div class="est-tile-label">Itens no nível OK</div></div>' +
      "</div>";

    var catGridHeader = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">' +
      '<h2 class="est-h2" style="margin:0">Por categoria</h2>' +
      (navigable && isAdmin() && !state.addingCategory ? '<button class="est-btn" data-action="show-add-category">' + ICON.plus + " Nova categoria</button>" : "") +
      "</div>";

    var categoryFormBlock = (navigable && isAdmin() && state.addingCategory) ? categoryFormHTML() : "";

    var catGrid = catGridHeader + categoryFormBlock + '<div class="est-catgrid">' +
      state.categories.map(function (c) {
        var d = byCat[c.key] || { baixo: 0, medio: 0, ok: 0, total: 0 };
        return '<div class="est-catcard" ' + (navigable ? 'data-action="goto-cat" data-cat="' + c.key + '"' : "") +
          ' style="cursor:' + (navigable ? "pointer" : "default") + '">' +
          '<div class="est-catcard-top"><span class="est-dot" style="background:' + c.color + '"></span>' + esc(c.label) + "</div>" +
          '<div class="est-catcard-counts est-num">' +
          '<span style="color:' + STATUS_META.baixo.color + '">' + d.baixo + "</span>" +
          '<span style="color:' + STATUS_META.medio.color + '">' + d.medio + "</span>" +
          '<span style="color:' + STATUS_META.ok.color + '">' + d.ok + "</span>" +
          '<span style="color:#B4B8C0">· ' + d.total + " itens</span>" +
          "</div></div>";
      }).join("") + "</div>";

    var importBanner = (navigable && state.importMsg) ?
      ('<div class="est-login-msg ' + (state.importMsg.type === "error" ? "est-login-error" : "est-login-success") + '" style="margin-bottom:14px">' + esc(state.importMsg.text) + "</div>") : "";

    var excelBar = navigable ?
      ('<div class="est-toolbar">' +
      '<button class="est-btn" data-action="export-excel">' + ICON.download + " Exportar Excel</button>" +
      (canEditItems() ? '<button class="est-btn" data-action="trigger-import">' + ICON.upload + " Importar Excel</button>" : "") +
      '<input type="file" id="import-file" accept=".xlsx,.xls" style="display:none"/>' +
      "</div>") : "";

    var toolbar =
      importBanner + excelBar +
      '<h2 class="est-h2">Itens</h2><div class="est-toolbar">' +
      '<div class="est-search">' + ICON.search + '<input id="dash-search" placeholder="Buscar item…" oninput="App.filterDashboard()"/></div>' +
      '<select class="est-select" id="dash-filter" onchange="App.filterDashboard()">' +
      '<option value="all">Todas as categorias</option>' +
      state.categories.map(function (c) { return '<option value="' + c.key + '">' + esc(c.label) + "</option>"; }).join("") +
      "</select></div>" +
      '<div id="items-list"></div>';

    return '<div>' + tiles + catGrid + toolbar + "</div>";
  }

  function renderItemsListHTML(items) {
    var search = (document.getElementById("dash-search") || {}).value || "";
    var filterCat = (document.getElementById("dash-filter") || {}).value || "all";
    var order = { baixo: 0, medio: 1, ok: 2 };

    var filtered = items
      .filter(function (it) { return filterCat === "all" ? true : it.category === filterCat; })
      .filter(function (it) { return it.name.toLowerCase().indexOf(search.toLowerCase()) !== -1; })
      .sort(function (a, b) {
        return order[getStatus(a)] - order[getStatus(b)] || a.name.localeCompare(b.name);
      });

    if (filtered.length === 0) return '<div class="est-empty">Nenhum item encontrado.</div>';

    return filtered.map(function (it) {
      var cat = catMeta(it.category);
      return '<div class="est-row">' +
        '<span class="est-dot" style="background:' + cat.color + '"></span>' +
        '<div style="flex:1"><div class="est-row-name">' + esc(it.name) + '</div><div class="est-row-meta">' + esc(cat.label) + "</div></div>" +
        '<div class="est-num" style="font-size:13.5px;min-width:70px;text-align:right">' + (Number(it.qty) || 0) + " " + esc(it.unit) + "</div>" +
        statusBadge(getStatus(it)) +
        "</div>";
    }).join("");
  }

  function movementFormHTML(item, type) {

        '<div class="est-field"><label class="est-label">Nomeação da retirada</label><input class="est-input" id="mv-name" placeholder="Ex.: Manutenção, nome de quem retirou…"/></div>' +

      '<div style="display:flex;gap:8px">' +

  function renderCategoryPage(categoryKey) {
    var cat = catMeta(categoryKey);
    var list = state.items.filter(function (it) { return it.category === categoryKey; });

    var header = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">' +
      '<div style="display:flex;align-items:center;gap:8px"><span class="est-dot" style="width:12px;height:12px;background:' + cat.color + '"></span>' +
      '<h2 class="est-h2" style="margin:0">' + esc(cat.label) + "</h2></div>" +
      (!state.adding && canEditItems() ? '<button class="est-btn est-btn-primary" data-action="show-add">' + ICON.plus + " Novo item</button>" : "") +
      "</div>";

    var formBlock = (state.adding && canEditItems()) ? itemFormHTML(categoryKey, null) : "";

    var rows;
    if (list.length === 0 && !state.adding) {
      rows = '<div class="est-empty">Nenhum item cadastrado em ' + esc(cat.label.toLowerCase()) + " ainda.</div>";
    } else {
      rows = list.map(function (it) {
        if (state.editingId === it.id && canEditItems()) return itemFormHTML(categoryKey, it);
        if (state.movementItemId === it.id && canEditItems()) return movementFormHTML(it, state.movementType);
        var moveBtns = canEditItems() ?
          ('<div style="display:flex;gap:4px">' +
          '<button class="est-btn est-btn-ghost" data-action="show-entrada" data-id="' + it.id + '" title="Registrar entrada">' + ICON.arrowIn + " Entrada</button>" +
          '<button class="est-btn est-btn-ghost" data-action="show-saida" data-id="' + it.id + '" title="Registrar saída">' + ICON.arrowOut + " Saída</button>" +
          "</div>") : "";
        var editBtn = canEditItems() ? ('<button class="est-btn est-btn-ghost" data-action="edit-item" data-id="' + it.id + '" title="Editar">' + ICON.edit + "</button>") : "";
        var delBtn = canDeleteItems() ? ('<button class="est-btn est-btn-ghost" data-action="delete-item" data-id="' + it.id + '" title="Excluir">' + ICON.trash + "</button>") : "";
        return '<div class="est-row" data-row-id="' + it.id + '">' +
          '<div style="flex:1"><div class="est-row-name">' + esc(it.name) + '</div><div class="est-row-meta est-num">' + (Number(it.qty) || 0) + " " + esc(it.unit) +

          '<span class="est-role-badge">' + (u.role === "admin" ? "Administrador" : "Editor") + "</span>" +

  function branchFormHTML() {
    return '<div class="est-form">' +
      (state.branchFormError ? '<div class="est-login-msg est-login-error">' + esc(state.branchFormError) + '</div>' : '') +
      '<div class="est-form-grid">' +
      '<div class="est-field"><label class="est-label">Nome da filial</label><input class="est-input" id="bf-name" placeholder="Ex.: Leaf 3"/></div>' +

  function matchesReportFilters(mv, f) {
    var d = localDateKey(new Date(mv.occurredAt));
    if (f.from && d < f.from) return false;
    if (f.to && d > f.to) return false;
    if (f.categoria && f.categoria !== "all" && mv.categoryKey !== f.categoria) return false;
    if (f.tipo && f.tipo !== "all" && mv.type !== f.tipo) return false;
    if (f.filial && f.filial !== "all" && mv.type === "saida" && mv.branch !== f.filial) return false;
    return true;
  }

  function defaultReportFilters() {
    return { from: firstDayOfMonthKey(), to: todayKey(), filial: "all", categoria: "all", tipo: "all" };
  }

  function readReportFilters() {
    return {
      from: (document.getElementById("rep-from") || {}).value || "",
      to: (document.getElementById("rep-to") || {}).value || "",
      filial: (document.getElementById("rep-filial") || {}).value || "all",
      categoria: (document.getElementById("rep-categoria") || {}).value || "all",
      tipo: (document.getElementById("rep-tipo") || {}).value || "all"
    };
  }

  function movementRowHTML(mv) {
    var cat = catMeta(mv.categoryKey);
    var isEntrada = mv.type === "entrada";
    var detail = isEntrada ?
      ("Valor unit. " + brl(mv.unitValue)) :
      (esc((findBranchByKey(mv.branch) || {}).label || mv.branch) + " · " + esc(mv.withdrawalName || ""));
    return '<div class="est-row">' +
      (isEntrada ? ICON.arrowIn : ICON.arrowOut) +
      '<div style="flex:1"><div class="est-row-name">' + esc(mv.itemName) + " <span style=\"font-weight:400;color:#8A8F98\">· " + esc(cat.label) + "</span></div>" +
      '<div class="est-row-meta">' + fmtDateTime(mv.occurredAt) + " · " + detail + " · por " + esc(mv.registeredBy) + "</div></div>" +
      '<div class="est-num" style="text-align:right;min-width:90px">' + mv.qty + " " + esc(mv.unit) + '<br/><span style="color:#8A8F98">' + brl(mv.totalValue) + "</span></div>" +
      "</div>";
  }

  function reportContentHTML(f) {
    var filters = f || readReportFilters();
    var filtered = state.movements.filter(function (mv) { return matchesReportFilters(mv, filters); });

    var totalGasto = 0, totalInvestido = 0;
    var byFilial = {};
    state.branches.forEach(function (b) { byFilial[b.key] = { label: b.label, qty: 0, valor: 0 }; });
    filtered.forEach(function (mv) {
      if (mv.type === "saida") {
        totalGasto += mv.totalValue;
        if (byFilial[mv.branch]) { byFilial[mv.branch].qty += mv.qty; byFilial[mv.branch].valor += mv.totalValue; }
      } else {
        totalInvestido += mv.totalValue;
      }
    });

    var tiles = '<div class="est-tiles">' +
      '<div class="est-tile" style="border-left-color:#DC2626"><div class="est-tile-num est-num" style="color:#DC2626">' + brl(totalGasto) + '</div><div class="est-tile-label">Total gasto (saídas)</div></div>' +
      '<div class="est-tile" style="border-left-color:#16A34A"><div class="est-tile-num est-num" style="color:#16A34A">' + brl(totalInvestido) + '</div><div class="est-tile-label">Total investido (entradas)</div></div>' +

  var AUDIT_ACTION_META = {
    criado: { label: "Criado", color: "#4F46E5" },
    entrada: { label: "Entrada", color: "#16A34A" },
    saida: { label: "Saída", color: "#D97706" },
    excluido: { label: "Excluído", color: "#DC2626" },
    deleted: { label: "Excluído", color: "#DC2626" }

  function auditLogRowHTML(entry) {
    var meta = AUDIT_ACTION_META[entry.action] || { label: entry.action, color: "#6B7280" };
    return '<div class="est-row">' +
      '<span class="est-badge" style="color:' + meta.color + ';background:' + meta.color + '1A">' + esc(meta.label) + "</span>" +

  function defaultLogFilters() {
    return { from: firstDayOfMonthKey(), to: todayKey() };
  }

  function readLogFilters() {
    return {
      from: (document.getElementById("log-from") || {}).value || "",
      to: (document.getElementById("log-to") || {}).value || ""
    };
  }

  function logContentHTML(f) {
    var filters = f || readLogFilters();
    var filtered = state.auditLog.filter(function (entry) {
      var d = localDateKey(new Date(entry.occurredAt));
      if (filters.from && d < filters.from) return false;
      if (filters.to && d > filters.to) return false;
      return true;
    });
    return filtered.length ? filtered.map(auditLogRowHTML).join("") : '<div class="est-empty">Nenhum registro de auditoria no período selecionado.</div>';
  }

  async function downloadPeriodExcel() {
    if (typeof XLSX === "undefined") {
      state.downloadMsg = { type: "error", text: "Não foi possível carregar a biblioteca de Excel. Verifique sua conexão com a internet e tente novamente." };
      render();
      return;
    }
    var f = readLogFilters();
    if (!f.from || !f.to) {
      state.downloadMsg = { type: "error", text: "Selecione o período (de/até) antes de baixar." };
      render();
      return;
    }
    var fromIso = new Date(f.from + "T00:00:00").toISOString();
    var toIso = new Date(f.to + "T23:59:59").toISOString();

    state.saving = true; render();
    var movRes = await supabaseClient.from("movements").select("*").gte("occurred_at", fromIso).lte("occurred_at", toIso).order("occurred_at", { ascending: false });
    var logRes = await supabaseClient.from("audit_log").select("*").gte("occurred_at", fromIso).lte("occurred_at", toIso).order("occurred_at", { ascending: false });
    state.saving = false;

    if (movRes.error || logRes.error) {
      state.downloadMsg = { type: "error", text: "Não foi possível buscar os dados do período selecionado." };
      render();
      return;
    }

    var movRows = (movRes.data || []).map(function (row) {
      return {
        "Data/hora": fmtDateTime(row.occurred_at),
        "Tipo": row.type === "entrada" ? "Entrada" : "Saída",
        "Item": row.item_name, "Categoria": row.category_key, "Unidade": row.unit,
        "Quantidade": Number(row.qty) || 0,
        "Valor unitário (R$)": Number(row.unit_value) || 0,
        "Valor total (R$)": Number(row.total_value) || 0,
        "Filial": row.branch || "", "Retirada/motivo": row.withdrawal_name || "",
        "Registrado por": row.registered_by || ""
      };
    });
    var logRows = (logRes.data || []).map(function (row) {
      return {
        "Data/hora": fmtDateTime(row.occurred_at), "Ação": (AUDIT_ACTION_META[row.action] || {}).label || row.action,
        "Tipo": row.entity_type, "Descrição": row.description, "Executado por": row.performed_by || ""
      };
    });

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(movRows.length ? movRows : [{ "Data/hora": "" }]), "Movimentacoes");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logRows.length ? logRows : [{ "Data/hora": "" }]), "Log de auditoria");

    try {
      XLSX.writeFile(wb, "controle-de-estoque-" + f.from + "-a-" + f.to + ".xlsx");
      state.downloadMsg = { type: "success", text: "Download gerado com " + movRows.length + " movimentação(ões) e " + logRows.length + " registro(s) de log." };
    } catch (e) {
      state.downloadMsg = { type: "error", text: "Não foi possível gerar o arquivo Excel." };
    }
    render();
  }

    var storageBlock = '<div style="margin-bottom:26px">' +

          '<div class="est-storage-bar"><div class="est-storage-fill ' + fillClass + '" style="width:' + Math.min(100, pct).toFixed(1) + '%"></div></div>')) +
      '<div class="est-row-meta" style="margin-top:8px">Vercel (hospedagem): como este site é 100% estático, o consumo de banda é mínimo. Não é possível checar o uso do Vercel automaticamente aqui dentro sem expor uma chave secreta no navegador — confira de vez em quando em vercel.com → seu projeto → aba Usage.</div>' +
      "</div>";

    var lf = defaultLogFilters();

      '<div class="est-field"><label class="est-label">Até</label><input class="est-input" type="date" id="log-to" value="' + lf.to + '" onchange="App.updateLog()"/></div>' +
      (isAdmin() ? '<button class="est-btn" data-action="download-period">' + ICON.download + " Baixar Excel do período</button>" : "") +
      "</div>";

        '<div class="est-row-meta" style="margin-bottom:8px">Apagar remove definitivamente as movimentações e os registros deste log anteriores à data escolhida (os itens do estoque não são afetados). Use isso para não lotar o limite gratuito do banco.</div>' +
        (!state.purgeConfirmPending ?
          ('<button class="est-btn" data-action="show-purge-confirm" style="border-color:#FCA5A5;color:#DC2626">' + ICON.trash + " Apagar dados antigos…</button>") :
          ('<div class="est-form" style="border-color:#FCA5A5;background:#FEF2F2">' +
            '<div class="est-field" style="max-width:220px;margin-bottom:10px"><label class="est-label">Apagar tudo anterior a</label><input class="est-input" type="date" id="purge-until" value="' + lf.to + '"/></div>' +
            '<div style="display:flex;gap:8px">' +

            '<button class="est-btn" data-action="cancel-purge">' + ICON.x + " Cancelar</button>" +

    return storageBlock + '<h2 class="est-h2">Log de auditoria</h2>' + filterBar + msgBlock + purgeBlock + '<div id="log-list">' + logContentHTML(lf) + "</div>";

  // ---------- calendário ----------

  var WEEKDAY_LABELS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
  var MONTH_LABELS = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

  function renderCalendarPage() {
    var monthKey = state.calendarMonth || currentMonthKey();
    var parts = monthKey.split("-");
    var year = Number(parts[0]), month = Number(parts[1]) - 1;
    var firstWeekday = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();

    var dayCounts = {};
    state.movements.forEach(function (mv) {
      var d = new Date(mv.occurredAt);
      var key = localDateKey(d);
      if (key.slice(0, 7) !== monthKey) return;
      if (!dayCounts[key]) dayCounts[key] = { entrada: 0, saida: 0 };
      dayCounts[key][mv.type]++;
    });

    var header = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">' +
      '<h2 class="est-h2" style="margin:0">Calendário</h2>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
      '<button class="est-btn est-btn-ghost" data-action="cal-prev">' + ICON.back + "</button>" +
      '<span style="font-weight:700;min-width:150px;text-align:center;display:inline-block">' + MONTH_LABELS[month] + " " + year + "</span>" +
      '<button class="est-btn est-btn-ghost" data-action="cal-next" style="transform:rotate(180deg)">' + ICON.back + "</button>" +
      "</div></div>";

    var grid = '<div class="est-cal-grid">' +
      WEEKDAY_LABELS.map(function (w) { return '<div class="est-cal-daylabel">' + w + "</div>"; }).join("");

    for (var i = 0; i < firstWeekday; i++) grid += '<div class="est-cal-cell est-cal-cell-empty"></div>';
    for (var day = 1; day <= daysInMonth; day++) {
      var key = monthKey + "-" + pad2(day);
      var c = dayCounts[key];
      var isSelected = state.calendarSelectedDate === key;
      var isToday = key === todayKey();
      grid += '<div class="est-cal-cell' + (isSelected ? " active" : "") + (isToday ? " today" : "") + '" data-action="cal-select-day" data-id="' + key + '">' +
        '<div class="est-cal-daynum">' + day + "</div>" +
        (c ? ('<div class="est-cal-dots">' +
          (c.entrada ? '<span class="est-cal-dot est-cal-dot-in">' + c.entrada + "</span>" : "") +
          (c.saida ? '<span class="est-cal-dot est-cal-dot-out">' + c.saida + "</span>" : "") +
          "</div>") : "") +
        "</div>";
    }
    grid += "</div>";

    var details = "";
    if (state.calendarSelectedDate) {
      var dayMovs = state.movements.filter(function (mv) { return localDateKey(new Date(mv.occurredAt)) === state.calendarSelectedDate; })
        .sort(function (a, b) { return new Date(b.occurredAt) - new Date(a.occurredAt); });
      var dParts = state.calendarSelectedDate.split("-");
      var niceDate = dParts[2] + "/" + dParts[1] + "/" + dParts[0];
      details = '<h2 class="est-h2">Movimentações em ' + niceDate + "</h2>" +
        (dayMovs.length ? dayMovs.map(movementRowHTML).join("") : '<div class="est-empty">Nenhuma movimentação nesse dia.</div>');
    }

    return header + grid + '<div style="margin-top:20px">' + details + "</div>";
  }

  function renderSetupNeeded() {
    return '<div class="est-login-wrap"><div class="est-login-card" style="max-width:460px;text-align:left">' +
      '<div class="est-login-logo">' + LOGO_SVG + '</div>' +
      '<div class="est-login-title" style="text-align:center">Configuração do banco pendente</div>' +
      '<div class="est-login-sub" style="text-align:center">Este arquivo ainda não está ligado ao banco de dados compartilhado.</div>' +
      '<div class="est-login-msg est-login-error">Abra o arquivo HTML, encontre as constantes <b>SUPABASE_URL</b> e <b>SUPABASE_ANON_KEY</b> perto do início do &lt;script&gt; e cole os valores do seu projeto Supabase (Project Settings → API).</div>' +
      "</div></div>";
  }

  function render() {
    var root = document.getElementById("root");
    if (!supabaseConfigured) {
      root.innerHTML = renderSetupNeeded();
      return;
    }
    if (!forceView && !state.currentUser) {
      root.innerHTML = renderLogin();
      return;
    }
    var showDashboardOnly = forceView || state.previewView;

    var topRow = "";
    if (!showDashboardOnly && state.currentUser) {
      topRow = '<div class="est-header-row">' +
        '<span class="est-user-chip">' + ICON.user + " " + esc(state.currentUser.username) + "</span>" +
        '<span class="est-role-badge">' + (isAdmin() ? "Administrador" : "Editor") + "</span>" +
        '<button class="est-btn" data-action="logout">' + ICON.logout + " Sair</button>" +
        "</div>";
    }

    var bottomRow = '<div class="est-header-row">';
    if (state.lastUpdated) bottomRow += '<span class="est-readonly-note est-num">Atualizado ' + timeStr(state.lastUpdated) + "</span>";
    if (state.saving) bottomRow += '<span class="est-readonly-note est-num">Salvando…</span>';
    bottomRow += '<button class="est-btn" data-action="refresh">' + ICON.refresh + " Atualizar</button>";
    if (!forceView && !state.previewView) {
      bottomRow += '<button class="est-btn" data-action="preview-on">' + ICON.eye + " Ver como painel</button>";
      bottomRow += '<button class="est-btn est-btn-primary" data-action="copy-link">' + ICON.copy + " " + (state.copied ? "Link copiado!" : "Copiar link do painel") + "</button>";
    }
    if (state.previewView && !forceView) {
      bottomRow += '<button class="est-btn" data-action="preview-off">' + ICON.back + " Voltar à gestão</button>";
    }
    bottomRow += "</div>";

    var headerRight = '<div class="est-header-right-col">' + topRow + bottomRow + "</div>";

    var header = '<div class="est-header"><div class="est-brand"><div class="est-logo-mark">' + LOGO_SVG + '</div><div>' +
      '<div class="est-title">Controle de Estoque</div>' +
      (showDashboardOnly ? '<div class="est-sub">Painel · somente leitura</div>' : "") +
      "</div></div>" + headerRight + "</div>";

    var errorBanner = (!showDashboardOnly && state.globalError) ?
      ('<div class="est-login-msg est-login-error">' + esc(state.globalError) + "</div>") : "";
    var warningBanner = (!showDashboardOnly && state.storageWarning) ?
      ('<div class="est-warning-banner">' + esc(state.storageWarning) + "</div>") : "";

    var sidebar = "";
    if (!showDashboardOnly) {
      var estoqueItems = '<div class="est-sidebar-item' + (state.activeTab === "dashboard" ? " active" : "") + '" data-action="goto-cat" data-cat="dashboard">' + ICON.grid + " Dashboard</div>" +
        state.categories.map(function (c) {
          return '<div class="est-sidebar-item' + (state.activeTab === c.key ? " active" : "") + '" data-action="goto-cat" data-cat="' + c.key + '"><span class="est-dot" style="background:' + c.color + '"></span> ' + esc(c.label) + "</div>";
        }).join("");

      var relatoriosItems =
        '<div class="est-sidebar-item' + (state.activeTab === "relatorios" ? " active" : "") + '" data-action="goto-cat" data-cat="relatorios">' + ICON.report + " Relatórios</div>" +
        '<div class="est-sidebar-item' + (state.activeTab === "calendario" ? " active" : "") + '" data-action="goto-cat" data-cat="calendario">' + ICON.calendar + " Calendário</div>" +
        '<div class="est-sidebar-item' + (state.activeTab === "log" ? " active" : "") + '" data-action="goto-cat" data-cat="log">' + ICON.download + " Log &amp; armazenamento</div>";

      var adminItem = '<div class="est-sidebar-item' + (state.activeTab === "admin" ? " active" : "") + '" data-action="goto-cat" data-cat="admin">' + ICON.user + " " + (isAdmin() ? "Admin" : "Minha conta") + "</div>";

      sidebar = '<div class="est-sidebar">' +
        '<div class="est-sidebar-section"><div class="est-sidebar-title">Estoque</div>' + estoqueItems + "</div>" +
        '<div class="est-sidebar-section"><div class="est-sidebar-title">Relatórios Gerais</div>' + relatoriosItems + "</div>" +
        '<div class="est-sidebar-section">' + adminItem + "</div>" +
        "</div>";
    }

    var main;
    if (state.loading) {
      main = '<div class="est-empty">Carregando estoque…</div>';
    } else if (showDashboardOnly) {
      main = renderDashboard(state.items, false);
    } else if (state.activeTab === "dashboard") {
      main = renderDashboard(state.items, true);
    } else if (state.activeTab === "admin") {
      main = renderAdminPage();
    } else if (state.activeTab === "relatorios") {
      main = renderReportsPage();
    } else if (state.activeTab === "calendario") {
      main = renderCalendarPage();
    } else if (state.activeTab === "log") {
      main = renderLogPage();
    } else {
      main = renderCategoryPage(state.activeTab);
    }

    var contentInner = errorBanner + warningBanner + '<div class="est-main">' + main + "</div>";

    if (showDashboardOnly) {
      root.innerHTML = '<div class="est-wrap">' + header + contentInner + "</div>";
    } else {
      root.innerHTML = '<div class="est-wrap">' + header + '<div class="est-shell">' + sidebar + '<div class="est-content">' + contentInner + "</div></div></div>";
    }

    if ((showDashboardOnly || state.activeTab === "dashboard") && !state.loading) {
      var listEl = document.getElementById("items-list");
      if (listEl) listEl.innerHTML = renderItemsListHTML(state.items);
    }
  }

  // ---------- actions ----------

  var App = {
    filterDashboard: function () {
      var listEl = document.getElementById("items-list");
      if (listEl) listEl.innerHTML = renderItemsListHTML(state.items);
    },
    updateReport: function () {
      var el = document.getElementById("report-content");
      if (el) el.innerHTML = reportContentHTML();
    },
    updateLog: function () {
      var el = document.getElementById("log-list");
      if (el) el.innerHTML = logContentHTML();
    }
  };
  window.App = App;

  document.addEventListener("click", async function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    var cat = el.getAttribute("data-cat");

    if (action === "login-submit") {
      doLogin();
    } else if (action === "logout") {
      doLogout();
    } else if (action === "save-password") {
      doChangePassword();
    } else if (action === "show-add-user") {
      if (!isAdmin()) return;
      state.addingUser = true; state.editingUserId = null; state.userFormError = ""; render();
    } else if (action === "cancel-user-form") {
      state.addingUser = false; state.editingUserId = null; state.userFormError = ""; render();
    } else if (action === "edit-user") {
      if (!isAdmin()) return;
      state.editingUserId = id; state.addingUser = false; state.userFormError = ""; render();
    } else if (action === "save-user") {
      if (!isAdmin()) return;
      var roleVal = (document.getElementById("uf-role") || {}).value || "editor";
      var passVal = (document.getElementById("uf-password") || {}).value || "";
      state.userFormError = "";
      if (id) {
        var target = findUserById(id);
        if (!target) { state.addingUser = false; state.editingUserId = null; render(); return; }
        if (target.role === "admin" && roleVal !== "admin") {
          var adminCount1 = state.users.filter(function (u) { return u.role === "admin"; }).length;
          if (adminCount1 <= 1) { state.userFormError = "Não é possível remover o último administrador."; render(); return; }
        }
        var userUpdates = { role: roleVal };
        if (passVal) userUpdates.password_hash = hashPass(passVal);
        state.saving = true; render();
        var uRes = await supabaseClient.from("users").update(userUpdates).eq("id", id);
        state.saving = false;
        if (uRes.error) { state.userFormError = "Não foi possível salvar: " + uRes.error.message; render(); return; }
        target.role = roleVal;
        if (passVal) target.passwordHash = hashPass(passVal);
        if (state.currentUser && state.currentUser.id === target.id) state.currentUser = target;
        state.editingUserId = null;
        render();
      } else {
        var unameVal = ((document.getElementById("uf-username") || {}).value || "").trim();
        if (!unameVal) { state.userFormError = "Informe um nome de usuário."; render(); return; }
        if (findUserByUsername(unameVal)) { state.userFormError = "Já existe um usuário com esse nome."; render(); return; }
        if (!passVal) { state.userFormError = "Informe uma senha."; render(); return; }
        var newUserRow = { id: uid(), username: unameVal, password_hash: hashPass(passVal), role: roleVal, created_at: new Date().toISOString() };
        state.saving = true; render();
        var insRes = await supabaseClient.from("users").insert(newUserRow);
        state.saving = false;
        if (insRes.error) { state.userFormError = "Não foi possível criar: " + insRes.error.message; render(); return; }
        state.users.push(mapUserFromDb(newUserRow));
        state.addingUser = false;
        render();
      }
    } else if (action === "delete-user") {
      if (!isAdmin()) return;
      if (state.currentUser && state.currentUser.id === id) return;
      var delTarget = findUserById(id);
      if (!delTarget) return;
      if (delTarget.role === "admin") {
        var adminCount2 = state.users.filter(function (u) { return u.role === "admin"; }).length;
        if (adminCount2 <= 1) { state.userFormError = "Não é possível excluir o último administrador."; render(); return; }
      }
      state.saving = true; render();
      var dRes = await supabaseClient.from("users").delete().eq("id", id);
      state.saving = false;
      if (dRes.error) { state.userFormError = "Não foi possível excluir: " + dRes.error.message; render(); return; }
      state.users = state.users.filter(function (u) { return u.id !== id; });
      render();
    } else if (action === "goto-cat") {
      state.activeTab = cat;
      state.adding = false;
      state.editingId = null;
      state.passwordError = "";
      state.passwordSuccess = false;
      state.addingUser = false;
      state.editingUserId = null;
      state.addingCategory = false;
      state.categoryFormError = "";
      state.importMsg = null;
      state.movementItemId = null;
      state.movementType = null;
      state.movementError = "";
      state.addingBranch = false;
      state.branchFormError = "";
      state.purgeConfirmPending = false;
      state.purgeMsg = null;
      state.downloadMsg = null;
      if (cat === "calendario" && !state.calendarMonth) state.calendarMonth = currentMonthKey();
      render();
    } else if (action === "show-add-category") {
      if (!isAdmin()) return;
      state.addingCategory = true; state.categoryFormError = ""; render();
    } else if (action === "cancel-category-form") {
      state.addingCategory = false; state.categoryFormError = ""; render();
    } else if (action === "save-category") {
      if (!isAdmin()) return;
      var catName = ((document.getElementById("cf-name") || {}).value || "").trim();
      var catColor = (document.getElementById("cf-color") || {}).value || "#4F46E5";
      if (!catName) { state.categoryFormError = "Informe um nome para a categoria."; render(); return; }
      if (findCategoryByLabel(catName)) { state.categoryFormError = "Já existe uma categoria com esse nome."; render(); return; }
      var newCatRow = { key: uniqueCategoryKey(slugify(catName)), label: catName, color: catColor };
      state.saving = true; render();
      var catRes = await insertCategory(newCatRow);
      state.saving = false;
      if (catRes.error) { state.categoryFormError = "Não foi possível salvar: " + catRes.error.message; render(); return; }
      state.categories.push(newCatRow);
      state.addingCategory = false;
      state.categoryFormError = "";
      render();
    } else if (action === "show-add-branch") {
      if (!isAdmin()) return;
      state.addingBranch = true; state.branchFormError = ""; render();
    } else if (action === "cancel-branch-form") {
      state.addingBranch = false; state.branchFormError = ""; render();
    } else if (action === "save-branch") {
      if (!isAdmin()) return;
      var branchName = ((document.getElementById("bf-name") || {}).value || "").trim();
      if (!branchName) { state.branchFormError = "Informe um nome para a filial."; render(); return; }
      if (findBranchByLabel(branchName)) { state.branchFormError = "Já existe uma filial com esse nome."; render(); return; }
      var newBranchRow = { key: uniqueBranchKey(slugify(branchName)), label: branchName };
      state.saving = true; render();
      var branchRes = await insertBranch(newBranchRow);
      state.saving = false;
      if (branchRes.error) { state.branchFormError = "Não foi possível salvar: " + branchRes.error.message; render(); return; }
      state.branches.push(newBranchRow);
      state.addingBranch = false;
      state.branchFormError = "";
      render();
    } else if (action === "export-excel") {
      exportExcel();
    } else if (action === "trigger-import") {
      if (!canEditItems()) return;
      var fileInput = document.getElementById("import-file");
      if (fileInput) fileInput.click();
    } else if (action === "refresh") {
      state.loading = true; render();
      await refreshAllData();
      render();
    } else if (action === "preview-on") {
      state.previewView = true; render();
    } else if (action === "preview-off") {
      state.previewView = false; render();
    } else if (action === "copy-link") {
      try {
        var url = new URL(window.location.href);
        url.searchParams.set("view", "dashboard");
        navigator.clipboard.writeText(url.toString());
        state.copied = true;
        render();
        setTimeout(function () { state.copied = false; render(); }, 2000);
      } catch (err) {}
    } else if (action === "show-add") {
      if (!canEditItems()) return;
      state.adding = true; state.editingId = null; render();
      var nameEl = document.getElementById("if-name"); if (nameEl) nameEl.focus();
    } else if (action === "cancel-form") {
      state.adding = false; state.editingId = null; render();
    } else if (action === "save-item") {
      if (!canEditItems()) return;
      var name = (document.getElementById("if-name") || {}).value || "";
      if (!name.trim()) return;
      var unitVal = ((document.getElementById("if-unit") || {}).value || "un").trim() || "un";
      var minVal = Number((document.getElementById("if-min") || {}).value) || 0;
      var idealVal = Number((document.getElementById("if-ideal") || {}).value) || 0;
      state.itemFormError = "";
      if (id) {
        state.saving = true; render();
        var updRes = await supabaseClient.from("items").update({ name: name.trim(), unit: unitVal, min: minVal, ideal: idealVal }).eq("id", id);
        state.saving = false;
        if (updRes.error) { state.itemFormError = "Não foi possível salvar: " + updRes.error.message; render(); return; }
        var existingItem = findItemById(id);
        if (existingItem) { existingItem.name = name.trim(); existingItem.unit = unitVal; existingItem.min = minVal; existingItem.ideal = idealVal; }
      } else {
        var initQty = Math.max(0, Number((document.getElementById("if-qty") || {}).value) || 0);
        var initValue = Math.max(0, Number((document.getElementById("if-value") || {}).value) || 0);
        var newItemId = uid();
        state.saving = true; render();
        var createRes = await supabaseClient.rpc("criar_item_inicial", {
          p_id: newItemId, p_category: cat, p_name: name.trim(), p_unit: unitVal, p_qty: initQty,
          p_min: minVal, p_ideal: idealVal, p_valor_unit: initValue, p_registrado_por: state.currentUser.username
        });
        state.saving = false;
        if (createRes.error) { state.itemFormError = "Não foi possível criar o item: " + createRes.error.message; render(); return; }
        await refetchItem(newItemId);
        if (initQty > 0) await refetchMovement(newItemId + "-init");
      }
      state.adding = false; state.editingId = null; state.itemFormError = "";
      render();
    } else if (action === "edit-item") {
      if (!canEditItems()) return;
      state.editingId = id; state.adding = false; state.itemFormError = ""; render();
    } else if (action === "delete-item") {
      if (!canDeleteItems()) return;
      state.saving = true; render();
      var delRes = await supabaseClient.rpc("excluir_item", { p_item_id: id, p_excluido_por: state.currentUser.username });
      state.saving = false;
      if (delRes.error) { state.globalError = "Não foi possível excluir o item: " + delRes.error.message; render(); return; }
      state.items = state.items.filter(function (it) { return it.id !== id; });
      state.movements = state.movements.filter(function (mv) { return mv.itemId !== id; });
      loadAuditLog();
      render();
    } else if (action === "show-entrada" || action === "show-saida") {
      if (!canEditItems()) return;
      state.movementItemId = id;
      state.movementType = action === "show-entrada" ? "entrada" : "saida";
      state.movementError = "";
      state.editingId = null;
      render();
    } else if (action === "cancel-movement") {
      state.movementItemId = null; state.movementType = null; state.movementError = ""; render();
    } else if (action === "save-movement") {
      if (!canEditItems()) return;
      var mvItem = findItemById(id);
      if (!mvItem) { state.movementItemId = null; render(); return; }
      var qtyVal = Number((document.getElementById("mv-qty") || {}).value);
      var dtVal = (document.getElementById("mv-datetime") || {}).value || "";
      state.movementError = "";
      if (!qtyVal || qtyVal <= 0) { state.movementError = "Informe uma quantidade válida."; render(); return; }
      var occurredAt = dtVal ? new Date(dtVal) : new Date();
      if (isNaN(occurredAt.getTime())) occurredAt = new Date();
      var newMovementId = uid();

      if (state.movementType === "entrada") {
        var unitValue = Number((document.getElementById("mv-value") || {}).value);
        if (unitValue == null || isNaN(unitValue) || unitValue < 0) unitValue = 0;
        state.saving = true; render();
        var entradaRes = await supabaseClient.rpc("registrar_entrada", {
          p_id: newMovementId, p_item_id: mvItem.id, p_qtd: qtyVal, p_valor_unit: unitValue,
          p_ocorrido_em: occurredAt.toISOString(), p_registrado_por: state.currentUser.username
        });
        state.saving = false;
        if (entradaRes.error) { state.movementError = entradaRes.error.message || "Não foi possível registrar a entrada."; render(); return; }
      } else {
        var withdrawalName = ((document.getElementById("mv-name") || {}).value || "").trim();
        var branchKey = (document.getElementById("mv-branch") || {}).value || "";
        if (!withdrawalName) { state.movementError = "Informe o nome/motivo da retirada."; render(); return; }
        if (!findBranchByKey(branchKey)) { state.movementError = "Selecione a filial."; render(); return; }
        state.saving = true; render();
        var saidaRes = await supabaseClient.rpc("registrar_saida", {
          p_id: newMovementId, p_item_id: mvItem.id, p_qtd: qtyVal, p_nome_retirada: withdrawalName, p_filial: branchKey,
          p_ocorrido_em: occurredAt.toISOString(), p_registrado_por: state.currentUser.username
        });
        state.saving = false;
        if (saidaRes.error) { state.movementError = saidaRes.error.message || "Não foi possível registrar a saída."; render(); return; }
      }

      await Promise.all([refetchItem(mvItem.id), refetchMovement(newMovementId)]);
      loadAuditLog();
      loadDbSize();
      state.movementItemId = null;
      state.movementType = null;
      render();
    } else if (action === "delete-movement") {
      if (!isAdmin()) return;
      state.saving = true; render();
      var delMovRes = await supabaseClient.rpc("excluir_movimento", { p_movement_id: id, p_excluido_por: state.currentUser.username });
      state.saving = false;
      if (delMovRes.error) { state.globalError = "Não foi possível excluir a movimentação: " + delMovRes.error.message; render(); return; }
      state.movements = state.movements.filter(function (m) { return m.id !== id; });
      await loadAuditLog();
      render();
      var reportEl = document.getElementById("report-content");
      if (reportEl) reportEl.innerHTML = reportContentHTML();
    } else if (action === "download-period") {
      if (!isAdmin()) return;
      await downloadPeriodExcel();
    } else if (action === "show-purge-confirm") {
      if (!isAdmin()) return;
      state.purgeConfirmPending = true; state.purgeMsg = null; render();
    } else if (action === "cancel-purge") {
      state.purgeConfirmPending = false; render();
    } else if (action === "confirm-purge") {
      if (!isAdmin()) return;
      var untilVal = (document.getElementById("purge-until") || {}).value || "";
      if (!untilVal) { state.purgeMsg = { type: "error", text: "Selecione uma data." }; render(); return; }
      var untilIso = new Date(untilVal + "T00:00:00").toISOString();
      state.purging = true; render();
      var purgeRes = await supabaseClient.rpc("purgar_periodo", { p_ate: untilIso, p_executado_por: state.currentUser.username });
      state.purging = false;
      if (purgeRes.error) { state.purgeMsg = { type: "error", text: "Não foi possível apagar: " + purgeRes.error.message }; render(); return; }
      state.purgeConfirmPending = false;
      state.purgeMsg = { type: "success", text: "Removidos " + purgeRes.data + " registro(s) anteriores a " + untilVal.split("-").reverse().join("/") + "." };
      await Promise.all([loadMovements(), loadAuditLog(), loadDbSize()]);
      render();
    } else if (action === "cal-prev" || action === "cal-next") {
      var parts = (state.calendarMonth || currentMonthKey()).split("-");
      var y = Number(parts[0]), m = Number(parts[1]) - 1;
      var d = new Date(y, m + (action === "cal-next" ? 1 : -1), 1);
      state.calendarMonth = d.getFullYear() + "-" + pad2(d.getMonth() + 1);
      state.calendarSelectedDate = "";
      render();
    } else if (action === "cal-select-day") {
      state.calendarSelectedDate = state.calendarSelectedDate === id ? "" : id;
      render();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var id = e.target && e.target.id;
    if (id === "login-user" || id === "login-pass") {
      e.preventDefault();
      doLogin();
    } else if (id === "chpwd-current" || id === "chpwd-new" || id === "chpwd-confirm") {
      e.preventDefault();
      doChangePassword();
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "import-file") {
      var f = e.target.files && e.target.files[0];
      if (f) handleImportFile(f);
      e.target.value = "";
    }
  });

  async function refreshAllData() {
    await Promise.all([loadItems(), loadMovements(), loadCategories(), loadBranches(), loadUsers(), loadAuditLog(), loadDbSize()]);
  }

  // Evita que uma atualização automática em segundo plano apague o que
  // a pessoa está digitando (busca, formulário de item/movimentação
  // aberto, etc.) — nesses casos, a atualização é adiada, não perdida.
  function shouldSkipAutoRefresh() {
    var ae = document.activeElement;
    if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT")) return true;
    if (state.saving || state.loading) return true;
    if (state.adding || state.editingId || state.movementItemId || state.addingCategory || state.addingBranch || state.purgeConfirmPending) return true;
    return false;
  }

  // ---------- atualização em tempo real (Supabase Realtime) ----------
  // Sempre que alguém (em qualquer computador/celular) adiciona, edita
  // ou exclui algo, o Supabase avisa este app na hora e a tela é
  // atualizada sozinha, sem precisar clicar em "Atualizar".
  var realtimeRefreshTimer = null;
  function scheduleRealtimeRefresh() {
    if (realtimeRefreshTimer) clearTimeout(realtimeRefreshTimer);
    realtimeRefreshTimer = setTimeout(function tryRealtimeRefresh() {
      if (shouldSkipAutoRefresh()) { realtimeRefreshTimer = setTimeout(tryRealtimeRefresh, 3000); return; }
      realtimeRefreshTimer = null;
      refreshAllData().then(render);
    }, 700);
  }

  function startRealtime() {
    if (!supabaseClient) return;
    var channel = supabaseClient.channel("estoque-live-changes");
    ["items", "movements", "categories", "branches", "users", "audit_log"].forEach(function (t) {
      channel.on("postgres_changes", { event: "*", schema: "public", table: t }, scheduleRealtimeRefresh);
    });
    channel.subscribe();
  }

  async function initApp() {
    if (!supabaseConfigured) { state.loading = false; render(); return; }
    await Promise.all([loadItems(), loadUsers(), loadCategories(), loadBranches(), loadMovements()]);
    loadSession();
    state.calendarMonth = currentMonthKey();
    render();

    if (!forceView) {
      await Promise.all([loadAuditLog(), loadDbSize()]);
      render();
      startRealtime();
    }

    if (forceView) {
      setInterval(async function () { await loadItems(); render(); }, 20000);
    }
  }

  initApp();
})();
</script>
</body>
</html>
